apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # ACM itself: its subscription, operator group and MultiClusterHub. Leave it out on a hub that already runs ACM.
  name: acm-install
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@templateRepoURL@'
    targetRevision: HEAD
    path: apps/acm/manifests
    directory:
      include: '{subscription.yaml,operator-group.yaml,multiclusterhub.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
