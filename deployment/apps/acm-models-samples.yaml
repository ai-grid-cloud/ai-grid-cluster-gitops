apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The sample models and their subscription, for this deployment's own
  # organization. Another deployment leaves this out.
  name: acm-models-samples
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@templateRepoURL@'
    targetRevision: HEAD
    path: apps/acm-models/hub
    # A plain directory without the provider console's files
    # (<deployment>/apps/acm-models.yaml has them).
    directory:
      exclude: '{kustomization.yaml,catalog-*,ai-grid-ready.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
