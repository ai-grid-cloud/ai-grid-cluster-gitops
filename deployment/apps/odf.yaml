apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # OpenShift Data Foundation on the hub: storage for ACM observability
  # (<deployment>/apps/acm-observability.yaml). Heavy; leave it out where
  # observability stores metrics elsewhere.
  name: odf
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@templateRepoURL@'
    targetRevision: HEAD
    path: apps/odf/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
