# The lab roots' tenant IdP lookups. Their idpIssuerURL is a hub template that
# finds the library's Keycloak through ManagedCluster claims and Route
# maas-db/keycloak, as ServiceAccount redhat-ai-grid/rhoai-tenant-templating,
# and the governance add-on reads the Route too. These are the grants the
# tenant Policy had before its IdP became an input; the lab roots' rhoai
# Application syncs this directory as a second source.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-tenant-templating
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    resourceNames:
      - keycloak
    verbs:
      - get
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - keycloak-secrets
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-tenant-templating
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: rhoai-tenant-templating
    namespace: redhat-ai-grid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-tenant-templating
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-tenant-templating
  namespace: openshift-config-managed
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-tenant-templating
  namespace: openshift-config-managed
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: rhoai-tenant-templating
    namespace: redhat-ai-grid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-tenant-templating
---
# Finds the external-services cluster, which holds Keycloak when it is not the hub.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-tenant-templating
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - managedclusters
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-tenant-templating
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: rhoai-tenant-templating
    namespace: redhat-ai-grid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-tenant-templating
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-hub-templating-routes
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    resourceNames:
      - keycloak
    verbs:
      - get
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-hub-templating-routes
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: Group
    name: system:open-cluster-management:addon:governance-standalone-hub-templating
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-hub-templating-routes
