# Upstream's lab root: it reads every component from this repository and sets
# every input to the lab's value itself. A hub installed from a deployment
# repository uses bootstrap/hub instead (bootstrap/hub/README.md).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    # Keep deployed resources when the root or a generated Application is removed.
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
        revision: HEAD
        files:
          - path: apps/*/application.yaml
          # The usage-log store belongs to the dedicated-hub profile. A standard hub
          # already runs apps/ai-grid-o11y, so generating this app here would stand
          # up a second LokiStack and a second object bucket beside it.
          - path: apps/ai-grid-usage-logs/application.yaml
            exclude: true
          # Only the dedicated-hub profile installs cert-manager, registers clusters and runs MaaS on a site.
          - path: apps/cert-manager/application.yaml
            exclude: true
          - path: apps/argo-registration/application.yaml
            exclude: true
          - path: apps/external-services/application.yaml
            exclude: true
          # Sample models: acm-models syncs them (see the templatePatch).
          - path: apps/acm-models-samples/application.yaml
            exclude: true
          - path: cluster-config/application.yaml
        # This repository is both the library and this root's deployment:
        # components write it as @libraryRepoURL@ at @libraryRevision@ (and
        # @deploymentRepoURL@ at @deploymentRevision@), and the templatePatch
        # fills those from these two values.
        # scripts/set-tenant-repo.sh rewrites them with the generator's
        # repoURL and revision above.
        values:
          repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
          targetRevision: HEAD
          # The lab's catalog: the console commits models and subscriptions here.
          catalogRepoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
          catalogRevision: main
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: '{{.metadata.namespace}}'
    spec:
      project: '{{.spec.project}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  # acm-models also syncs the sample models (apps/acm-models-samples), and
  # gitops-config the lab's cluster-admins Group (bootstrap/lab), so they keep
  # their Application. Then every @<name>@ a component writes is replaced from
  # $inputs, JSON-escaped. This repository is also the deployment repository:
  # the lab's values are in values/.
  templatePatch: |
    {{- $spec := .spec }}
    {{- if eq .metadata.name "acm-models" }}
    {{- $samples := dict "repoURL" "@libraryRepoURL@" "targetRevision" "@libraryRevision@" "path" "apps/acm-models-samples/hub"
          "kustomize" (dict "patches" (list (dict "target" (dict "kind" "ConfigMap" "name" "library-inputs")
            "patch" "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: library-inputs\ndata:\n  libraryRepoURL: '@libraryRepoURL@'\n  libraryRevision: '@libraryRevision@'\n"))) }}
    {{- $_ := set $spec "sources" (list $spec.source $samples) }}
    {{- $_ := unset $spec "source" }}
    {{- end }}
    {{- if eq .metadata.name "gitops-config" }}
    {{- $group := dict "repoURL" "@libraryRepoURL@" "targetRevision" "@libraryRevision@" "path" "bootstrap/lab/gitops-config" }}
    {{- $_ := set $spec "sources" (list $spec.source $group) }}
    {{- $_ := unset $spec "source" }}
    {{- end }}
    {{- $inputs := merge (dict "libraryRepoURL" .values.repoURL "libraryRevision" .values.targetRevision
          "deploymentRepoURL" .values.repoURL "deploymentRevision" .values.targetRevision) (omit .values "repoURL" "targetRevision") }}
    {{- $json := toJson $spec }}
    {{- range $name, $value := $inputs }}
    {{- $json = replace (printf "@%s@" $name) (toJson $value | trimPrefix "\"" | trimSuffix "\"") $json }}
    {{- end }}
    spec: {{ $json }}
