apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    # Keep deployed resources when the root or a generated Application is removed.
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
        revision: cloud-provider
        files:
          - path: apps/*/application.yaml
          # Only the dedicated-hub profile installs cert-manager, registers clusters and runs MaaS on a site.
          - path: apps/cert-manager/application.yaml
            exclude: true
          - path: apps/argo-registration/application.yaml
            exclude: true
          - path: apps/external-services/application.yaml
            exclude: true
          - path: cluster-config/application.yaml
        # The deployment repository: per-cluster values another deployment keeps
        # outside this repository (docs/acm/hub-onboarding). bootstrap.sh replaces
        # each value marked # DEPLOYMENT_* from its environment; the defaults name
        # this repository and a path it doesn't have, so nothing is read.
        values:
          deploymentRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git # DEPLOYMENT_REPO_URL
          deploymentRevision: cloud-provider # DEPLOYMENT_REVISION
          deploymentPath: deployment # DEPLOYMENT_PATH
          catalogRepoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git # DEPLOYMENT_CATALOG_REPO_URL
          templateRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
          templateRevision: cloud-provider
    # The deployment's own apps: one Application per <path>/apps/*.yaml in the
    # deployment repository, in the format of apps/*/application.yaml. With the
    # default path nothing matches.
    - git:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git # DEPLOYMENT_REPO_URL
        revision: cloud-provider # DEPLOYMENT_REVISION
        files:
          - path: deployment/apps/*.yaml # DEPLOYMENT_PATH
        values:
          deploymentRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git # DEPLOYMENT_REPO_URL
          deploymentRevision: cloud-provider # DEPLOYMENT_REVISION
          deploymentPath: deployment # DEPLOYMENT_PATH
          catalogRepoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git # DEPLOYMENT_CATALOG_REPO_URL
          templateRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
          templateRevision: cloud-provider
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: '{{.metadata.namespace}}'
    spec:
      project: '{{.spec.project}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  # An app names the deployment repository as @deploymentRepoURL@,
  # @deploymentRevision@ and @deploymentPath@, and this repository as
  # @templateRepoURL@ and @templateRevision@, replaced here.
  templatePatch: |
    spec: {{ .spec | toJson | replace "@deploymentRepoURL@" .values.deploymentRepoURL | replace "@deploymentRevision@" .values.deploymentRevision | replace "@deploymentPath@" .values.deploymentPath | replace "@templateRepoURL@" .values.templateRepoURL | replace "@templateRevision@" .values.templateRevision | replace "@catalogRepoURL@" .values.catalogRepoURL }}
