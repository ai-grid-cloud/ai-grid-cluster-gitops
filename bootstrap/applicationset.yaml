# Root ApplicationSet for every hub profile. bootstrap.sh applies it once ACM is
# Available; the root Application it generates then syncs it from Git, so after
# the initial bootstrap the ApplicationSet manages itself.
#
# The profiles differ only in the labels bootstrap.sh puts on
# managedcluster/local-cluster:
#
#   BOOTSTRAP_PROFILE       labels on local-cluster               hub runs
#   "" (default)            ai-grid/is-hub, ai-grid/is-maas-infra full stack incl. MaaS state
#   hub                     ai-grid/is-hub                        everything but MaaS state
#   acm-and-gitops-only     none                                  GitOps + ACM only
#
# "" and hub differ only in ai-grid/is-maas-infra, which adds the MaaS state
# apps (maas-db, limitador-redis, external-secrets). The old dedicated-hub
# profile (MaaS state on the hub) maps to the new default "".
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    # Keep deployed resources when the root or a generated Application is removed.
    preserveResourcesOnDeletion: true
  generators:
    # Self-management: the generated root Application syncs only
    # bootstrap/applicationset.yaml, so edits to this file apply automatically.
    - git:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
        revision: HEAD
        files:
          - path: bootstrap/application.yaml
    # ACM is pinned to local-cluster with no label requirement: bootstrap.sh
    # installs ACM by hand first, because the clusters generators below can
    # only match local-cluster after ACM surfaces its Argo CD cluster secret.
    # The generated acm Application adopts those resources. While the hub
    # carries no ai-grid/is-hub label its source narrows to ACM's OperatorGroup,
    # Subscription and MultiClusterHub; labelling the hub broadens it to the
    # full apps/acm/manifests.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
              revision: HEAD
              files:
                - path: apps/acm/application.yaml
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/cluster-name: local-cluster
    # The is-hub layer: the union of the former default and dedicated-hub app
    # lists minus the MaaS state apps, which move to the is-maas-infra layer
    # below. external-services stays hand-applied on a labelled site, and ODF
    # is generated separately once the hub's version is known.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
              revision: HEAD
              files:
                - path: apps/*/application.yaml
                - path: apps/acm/application.yaml
                  exclude: true
                - path: apps/external-secrets/application.yaml
                  exclude: true
                - path: apps/external-services/application.yaml
                  exclude: true
                - path: apps/limitador-redis/application.yaml
                  exclude: true
                - path: apps/maas-db/application.yaml
                  exclude: true
                - path: apps/odf/application.yaml
                  exclude: true
                - path: cluster-config/application.yaml
          - clusters:
              selector:
                matchLabels:
                  ai-grid/is-hub: "true"
    # Only ODF needs cluster metadata. Wait for ACM registration and its
    # version label: the operator channel must match the hub's OpenShift version.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
              revision: HEAD
              files:
                - path: apps/odf/application.yaml
          - clusters:
              selector:
                matchLabels:
                  ai-grid/is-hub: "true"
                matchExpressions:
                  - key: openshiftVersion-major-minor
                    operator: Exists
    # ai-grid-o11y is specified here rather than in
    # apps/ai-grid-o11y/application.yaml. The ref source exposes this repo to
    # the chart source as $values, so values/hub/ai-grid-o11y/values.yaml
    # layers environment-specific configuration over the chart's defaults.
    - matrix:
        generators:
          - list:
              elements:
                - metadata:
                    name: ai-grid-o11y
                    namespace: openshift-gitops
                  spec:
                    project: default
                    sources:
                      - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
                        targetRevision: HEAD
                        ref: values
                      - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
                        targetRevision: HEAD
                        path: charts/ai-grid-o11y
                        helm:
                          valueFiles:
                            - values.yaml
                            - $values/values/hub/ai-grid-o11y/values.yaml
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: open-cluster-management-observability
                    syncPolicy:
                      automated:
                        prune: true
                        selfHeal: true
                      retry:
                        refresh: true
                        limit: 10
                        backoff:
                          duration: 30s
                          factor: 2
                          maxDuration: 10m
                      syncOptions:
                        - CreateNamespace=true
                        - SkipDryRunOnMissingResource=true
          - clusters:
              selector:
                matchLabels:
                  ai-grid/is-hub: "true"
    # The is-maas-infra layer: MaaS shared state. Hub-only today; labelling
    # spoke clusters with ai-grid/is-maas-infra is the intent of the split but
    # is deferred. apps/external-services stays hand-applied.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
              revision: HEAD
              files:
                - path: apps/external-secrets/application.yaml
                - path: apps/limitador-redis/application.yaml
                - path: apps/maas-db/application.yaml
          - clusters:
              selector:
                matchLabels:
                  ai-grid/is-maas-infra: "true"
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: '{{.metadata.namespace}}'
    spec:
      project: '{{.spec.project}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  # Without ai-grid/is-hub the acm Application syncs only ACM's OperatorGroup,
  # Subscription and MultiClusterHub (the files bootstrap.sh applied by hand);
  # the label broadens it to the full apps/acm/manifests. grid-bootstrap owns
  # the global ManagedClusterSetBinding: managedClusters.createClusterSetBinding
  # is forced true and the rhoai app excludes its binding, since exactly one
  # binding for global must exist. external.certManager.ca.mode is left to the
  # chart default and per-hub values, so running grids keep their CA mode.
  # Limitador runs on the sites, so on a cluster that also carries is-hub,
  # limitador-redis leaves out its storage config. acm-models brings the sample
  # model and the console's catalog (its ApplicationSets and AppProjects), not
  # its GitOpsCluster: argo-registration registers clusters here. ODF's operator
  # channel follows the hub's OpenShift minor version. A hub labelled
  # ai-grid/odf-operatorgroup=existing keeps its own OperatorGroup.
  templatePatch: |
    {{- $spec := .spec }}
    {{- if eq .metadata.name "acm" }}
    {{- if not (index .metadata.labels "ai-grid/is-hub") }}
    {{- $_ := set $spec.source "directory" (dict "include" "{operator-group.yaml,subscription.yaml,multiclusterhub.yaml}") }}
    {{- end }}
    {{- end }}
    {{- if eq .metadata.name "grid-bootstrap" }}
    {{- range $spec.sources }}{{ if hasKey . "helm" }}
    {{- $_ := set .helm "parameters" (list (dict "name" "managedClusters.createClusterSetBinding" "value" "true")) }}
    {{- end }}{{ end }}
    {{- end }}
    {{- if eq .metadata.name "odf" }}
    {{- $params := list (dict "name" "openshift.version" "value" (index .metadata.labels "openshiftVersion-major-minor")) }}
    {{- if eq (index .metadata.labels "ai-grid/odf-operatorgroup") "existing" }}
    {{- $params = append $params (dict "name" "operatorGroup.create" "value" "false") }}
    {{- end }}
    {{- $_ := set $spec.source.helm "parameters" $params }}
    {{- end }}
    {{- if eq .metadata.name "acm-models" }}
    {{- $_ := set $spec.source "directory" (dict "include" "{facebook-opt-125m-03-applicationset.yaml,maas-03-applicationset.yaml,catalog-03-appprojects.yaml,catalog-04-applicationsets.yaml}") }}
    {{- end }}
    {{- if and (eq .metadata.name "limitador-redis") (index .metadata.labels "ai-grid/is-hub") }}
    {{- $_ := set $spec.source "directory" (dict "exclude" "{04-limitador-redis-secret.yaml,20-limitador-storage.yaml}") }}
    {{- end }}
    {{- if eq .metadata.name "rhoai" }}
    {{- $_ := set $spec.source "directory" (dict "exclude" "00-managed-cluster-set-binding-grid.yaml") }}
    {{- end }}
    spec: {{ $spec | toJson }}
