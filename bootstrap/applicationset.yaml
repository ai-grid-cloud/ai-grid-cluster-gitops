apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  generators:
    - git:
        repoURL: https://github.com/kahowell/ai-grid-tenant.git
        revision: HEAD
        files:
          - path: apps/*/application.yaml
          # Only the dedicated-hub profile installs cert-manager, registers clusters and runs MaaS on a site.
          - path: apps/cert-manager/application.yaml
            exclude: true
          - path: apps/argo-registration/application.yaml
            exclude: true
          - path: apps/maas-home/application.yaml
            exclude: true
          - path: cluster-config/application.yaml
    # Optional apps (keycloak, maas-db, limitador-redis) run only where the
    # deployment lists them, one Application per <deployment>/apps/*.yaml.
    - git:
        repoURL: ${DEPLOYMENT_REPO_URL}
        revision: ${DEPLOYMENT_REVISION}
        files:
          - path: ${DEPLOYMENT_PATH}/apps/*.yaml
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: '{{.metadata.namespace}}'
    spec:
      project: '{{.spec.project}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  # bootstrap.sh fills in DEPLOYMENT_REPO_URL, DEPLOYMENT_REVISION and
  # DEPLOYMENT_PATH. Each app names them as @deploymentRepoURL@,
  # @deploymentRevision@ and @deploymentPath@, the catalog repository as
  # @catalogRepoURL@ and @catalogRevision@, and this repository as
  # @templateRepoURL@ (so a deployment's app files don't name a fork),
  # replaced here.
  templatePatch: |
    spec: {{ .spec | toJson | replace "@templateRepoURL@" "https://github.com/kahowell/ai-grid-tenant.git" | replace "@deploymentRepoURL@" "${DEPLOYMENT_REPO_URL}" | replace "@deploymentRevision@" "${DEPLOYMENT_REVISION}" | replace "@deploymentPath@" "${DEPLOYMENT_PATH}" | replace "@catalogRepoURL@" "${CATALOG_REPO_URL}" | replace "@catalogRevision@" "${CATALOG_REVISION}" }}
