# Root ApplicationSet for a hub that runs no Grid or RHOAI workloads.
# Install it with BOOTSTRAP_PROFILE=dedicated-hub ./bootstrap.sh. It generates an
# Application (dedicated-hub-root) that syncs bootstrap/dedicated-hub, so after
# the initial bootstrap the ApplicationSet manages itself.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
              revision: HEAD
              files:
                - path: apps/acm/application.yaml
                - path: apps/acm-models/application.yaml
                - path: apps/ai-grid-o11y/application.yaml
                - path: apps/ai-grid-policies/application.yaml
                - path: apps/ai-grid-spokes/application.yaml
                - path: apps/cert-manager/application.yaml
                - path: apps/console/application.yaml
                - path: apps/gitops-config/application.yaml
                - path: apps/grid-bootstrap/application.yaml
                - path: apps/external-services/application.yaml
                - path: apps/maas-db/application.yaml
                - path: apps/keycloak/application.yaml
                - path: apps/limitador-redis/application.yaml
                - path: apps/external-secrets/application.yaml
                - path: apps/metallb/application.yaml
                - path: apps/argo-registration/application.yaml
                - path: apps/odf/application.yaml
                - path: apps/rhoai/application.yaml
                - path: apps/rhoai-prerequisites/application.yaml
                - path: bootstrap/dedicated-hub/application.yaml
              # The deployment repository: per-cluster values another deployment keeps
              # outside this repository (docs/acm/hub-onboarding). bootstrap.sh replaces
              # each value marked # DEPLOYMENT_* from its environment; the defaults name
              # this repository and a path it doesn't have, so nothing is read.
              values:
                deploymentRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git # DEPLOYMENT_REPO_URL
                deploymentRevision: HEAD # DEPLOYMENT_REVISION
                deploymentPath: deployment # DEPLOYMENT_PATH
                catalogRepoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git # DEPLOYMENT_CATALOG_REPO_URL
                templateRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
                templateRevision: HEAD
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/cluster-name: local-cluster
    # The deployment's own apps: one Application per <path>/apps/*.yaml in the
    # deployment repository, in the format of apps/*/application.yaml. With the
    # default path nothing matches.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git # DEPLOYMENT_REPO_URL
              revision: HEAD # DEPLOYMENT_REVISION
              files:
                - path: deployment/apps/*.yaml # DEPLOYMENT_PATH
              values:
                deploymentRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git # DEPLOYMENT_REPO_URL
                deploymentRevision: HEAD # DEPLOYMENT_REVISION
                deploymentPath: deployment # DEPLOYMENT_PATH
                catalogRepoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git # DEPLOYMENT_CATALOG_REPO_URL
                templateRepoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
                templateRevision: HEAD
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/cluster-name: local-cluster
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: '{{.metadata.namespace}}'
    spec:
      project: '{{.spec.project}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  # ODF provides the object storage ACM observability needs, so acm syncs
  # the full apps/acm/manifests. A new grid generates its CA, and grid-bootstrap
  # binds global in place of the rhoai app's binding. acm-models brings the
  # sample model and the console's catalog (its ApplicationSets and
  # AppProjects), not its GitOpsCluster: argo-registration registers clusters
  # here.
  # Limitador runs on the sites, so limitador-redis leaves out its storage config.
  # ODF's operator channel follows the hub's OpenShift minor version.
  # rhoai's source is a kustomization (apps/rhoai/application.yaml), so a patch
  # deletes the binding. Apps name the deployment repository as
  # @deploymentRepoURL@, @deploymentRevision@ and @deploymentPath@, and this
  # repository as @templateRepoURL@ and @templateRevision@, replaced here.
  # A deployment's app must not take one of the names above.
  # catalogRepoURL is the provider console's catalog. With another catalog,
  # acm-models leaves out the catalog files here, and the deployment delivers
  # them itself, pointed at its catalog (examples/deployment).
  templatePatch: |
    {{- $spec := .spec }}
    {{- if eq .metadata.name "grid-bootstrap" }}
    {{- range $spec.sources }}{{ if hasKey . "helm" }}
    {{- $_ := set .helm "parameters" (list (dict "name" "external.certManager.ca.mode" "value" "Generate") (dict "name" "managedClusters.createClusterSetBinding" "value" "true")) }}
    {{- end }}{{ end }}
    {{- end }}
    {{- if eq .metadata.name "odf" }}
    {{- $_ := set $spec.source.helm "parameters" (list (dict "name" "openshift.version" "value" (index .metadata.labels "openshiftVersion-major-minor"))) }}
    {{- end }}
    {{- if eq .metadata.name "acm-models" }}
    {{- if eq .values.catalogRepoURL "https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git" }}
    {{- $_ := set $spec.source "directory" (dict "include" "{facebook-opt-125m-03-applicationset.yaml,maas-03-applicationset.yaml,catalog-03-appprojects.yaml,catalog-04-applicationsets.yaml}") }}
    {{- else }}
    {{- $_ := set $spec.source "directory" (dict "include" "{facebook-opt-125m-03-applicationset.yaml,maas-03-applicationset.yaml}") }}
    {{- end }}
    {{- end }}
    {{- if eq .metadata.name "limitador-redis" }}
    {{- $_ := set $spec.source "directory" (dict "exclude" "{04-limitador-redis-secret.yaml,20-limitador-storage.yaml}") }}
    {{- end }}
    {{- if eq .metadata.name "rhoai" }}
    {{- $_ := set $spec.source.kustomize "patches" (append $spec.source.kustomize.patches (dict "patch" "$patch: delete\napiVersion: cluster.open-cluster-management.io/v1beta2\nkind: ManagedClusterSetBinding\nmetadata:\n  name: global\n  namespace: redhat-ai-grid\n")) }}
    {{- end }}
    spec: {{ $spec | toJson | replace "@deploymentRepoURL@" .values.deploymentRepoURL | replace "@deploymentRevision@" .values.deploymentRevision | replace "@deploymentPath@" .values.deploymentPath | replace "@templateRepoURL@" .values.templateRepoURL | replace "@templateRevision@" .values.templateRevision | replace "@catalogRepoURL@" .values.catalogRepoURL }}
