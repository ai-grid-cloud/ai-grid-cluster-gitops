# Upstream's lab root: it reads every component from this repository and sets
# every input to the lab's value itself. A hub installed from a deployment
# repository uses bootstrap/hub instead (bootstrap/hub/README.md).
# Root ApplicationSet for a hub that runs no Grid or RHOAI workloads.
# Install it with BOOTSTRAP_PROFILE=dedicated-hub ./bootstrap.sh. It generates an
# Application (dedicated-hub-root) that syncs bootstrap/dedicated-hub, so after
# the initial bootstrap the ApplicationSet manages itself.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    # Keep deployed resources when the root or a generated Application is removed.
    preserveResourcesOnDeletion: true
  generators:
    # ACM and argo-registration must start before a cluster Secret exists.
    - git:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
        revision: HEAD
        files:
          - path: apps/acm/application.yaml
          - path: apps/acm-models/application.yaml
          - path: apps/ai-grid-policies/application.yaml
          - path: apps/ai-grid-spokes/application.yaml
          - path: apps/cert-manager/application.yaml
          - path: apps/console/application.yaml
          - path: apps/gitops-config/application.yaml
          - path: apps/grid-bootstrap/application.yaml
          # MaaS state runs on this hub. apps/external-services, which holds it on a
          # labelled site instead, is applied by hand: a hub that runs it itself
          # would carry an empty external-services Placement.
          - path: apps/maas-db/application.yaml
          - path: apps/keycloak/application.yaml
          - path: apps/limitador-redis/application.yaml
          - path: apps/external-secrets/application.yaml
          - path: apps/metallb/application.yaml
          - path: apps/argo-registration/application.yaml
          - path: apps/rhoai/application.yaml
          - path: apps/rhoai-prerequisites/application.yaml
          - path: bootstrap/dedicated-hub/application.yaml
          # The delivery half of the hub's MaaS usage-log store: the Loki operator that
          # apps/ai-grid-o11y's LokiStack needs, and the ACM policy that hands each site
          # the writer token. apps/odf, its object storage, is listed below.
          - path: apps/ai-grid-usage-logs/application.yaml
        # This repository is both the library and this root's deployment:
        # components write it as @libraryRepoURL@ at @libraryRevision@ (and
        # @deploymentRepoURL@ at @deploymentRevision@), and the templatePatch
        # fills those from these two values.
        # scripts/set-tenant-repo.sh rewrites them with the generator's
        # repoURL and revision above.
        values:
          repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
          targetRevision: HEAD
          # The lab's catalog: the console commits models and subscriptions here.
          catalogRepoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
          catalogRevision: main
          # The lab's tenant IdP: the library's Keycloak (apps/keycloak), found
          # by a hub template on the cluster labelled ai-grid/external-services,
          # else on the hub. bootstrap/lab/rhoai grants the lookups it makes.
          idpIssuerURL: '{{hub $homes := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "" "ai-grid/external-services=true").items hub}}{{hub if $homes hub}}{{hub range (index $homes 0).status.clusterClaims hub}}{{hub if eq .name "consoleurl.cluster.open-cluster-management.io" hub}}{{hub printf "https://keycloak-maas-db.%s/realms/saas" (splitn "." 2 (replace "https://" "" .value))._1 hub}}{{hub end hub}}{{hub end hub}}{{hub else hub}}{{hub printf "https://%s/realms/saas" (index (lookup "route.openshift.io/v1" "Route" "maas-db" "keycloak").status.ingress 0).host hub}}{{hub end hub}}'
          idpClientID: tenant-demo
          idpClientSecretNamespace: maas-db
          idpClientSecretName: keycloak-secrets
          idpClientSecretKey: KEYCLOAK_CLIENT_SECRET
          idpCANamespace: openshift-config-managed
          idpCAName: default-ingress-cert
          idpCAKey: ca-bundle.crt
    # ai-grid-o11y is specified here rather than in
    # apps/ai-grid-o11y/application.yaml. The ref source exposes this repo to
    # the chart source as $values, so values/hub/ai-grid-o11y/values.yaml
    # layers environment-specific configuration over the chart's defaults.
    - list:
        elements:
          # values: as in the first generator, for the templatePatch.
          - values:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
              targetRevision: HEAD
              # The lab's catalog: the console commits models and subscriptions here.
              catalogRepoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
              catalogRevision: main
              # The lab's tenant IdP: the library's Keycloak (apps/keycloak), found
              # by a hub template on the cluster labelled ai-grid/external-services,
              # else on the hub. bootstrap/lab/rhoai grants the lookups it makes.
              idpIssuerURL: '{{hub $homes := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "" "ai-grid/external-services=true").items hub}}{{hub if $homes hub}}{{hub range (index $homes 0).status.clusterClaims hub}}{{hub if eq .name "consoleurl.cluster.open-cluster-management.io" hub}}{{hub printf "https://keycloak-maas-db.%s/realms/saas" (splitn "." 2 (replace "https://" "" .value))._1 hub}}{{hub end hub}}{{hub end hub}}{{hub else hub}}{{hub printf "https://%s/realms/saas" (index (lookup "route.openshift.io/v1" "Route" "maas-db" "keycloak").status.ingress 0).host hub}}{{hub end hub}}'
              idpClientID: tenant-demo
              idpClientSecretNamespace: maas-db
              idpClientSecretName: keycloak-secrets
              idpClientSecretKey: KEYCLOAK_CLIENT_SECRET
              idpCANamespace: openshift-config-managed
              idpCAName: default-ingress-cert
              idpCAKey: ca-bundle.crt
            metadata:
              name: ai-grid-o11y
              namespace: openshift-gitops
            spec:
              project: default
              sources:
                - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
                  targetRevision: HEAD
                  ref: values
                - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
                  targetRevision: HEAD
                  path: charts/ai-grid-o11y
                  helm:
                    valueFiles:
                      - values.yaml
                      - $values/values/hub/ai-grid-o11y/values.yaml
              destination:
                server: https://kubernetes.default.svc
                namespace: open-cluster-management-observability
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
                retry:
                  refresh: true
                  limit: 10
                  backoff:
                    duration: 30s
                    factor: 2
                    maxDuration: 10m
                syncOptions:
                  - CreateNamespace=true
                  - SkipDryRunOnMissingResource=true
    # Only ODF needs cluster metadata. Wait for ACM registration and its
    # version label: the operator channel must match the hub's OpenShift version.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
              revision: HEAD
              files:
                - path: apps/odf/application.yaml
              # As in the first generator: set-tenant-repo.sh rewrites these.
              values:
                repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
                targetRevision: HEAD
                # The lab's catalog: the console commits models and subscriptions here.
                catalogRepoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
                catalogRevision: main
                # The lab's tenant IdP: the library's Keycloak (apps/keycloak), found
                # by a hub template on the cluster labelled ai-grid/external-services,
                # else on the hub. bootstrap/lab/rhoai grants the lookups it makes.
                idpIssuerURL: '{{hub $homes := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "" "ai-grid/external-services=true").items hub}}{{hub if $homes hub}}{{hub range (index $homes 0).status.clusterClaims hub}}{{hub if eq .name "consoleurl.cluster.open-cluster-management.io" hub}}{{hub printf "https://keycloak-maas-db.%s/realms/saas" (splitn "." 2 (replace "https://" "" .value))._1 hub}}{{hub end hub}}{{hub end hub}}{{hub else hub}}{{hub printf "https://%s/realms/saas" (index (lookup "route.openshift.io/v1" "Route" "maas-db" "keycloak").status.ingress 0).host hub}}{{hub end hub}}'
                idpClientID: tenant-demo
                idpClientSecretNamespace: maas-db
                idpClientSecretName: keycloak-secrets
                idpClientSecretKey: KEYCLOAK_CLIENT_SECRET
                idpCANamespace: openshift-config-managed
                idpCAName: default-ingress-cert
                idpCAKey: ca-bundle.crt
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/cluster-name: local-cluster
                matchExpressions:
                  - key: openshiftVersion-major-minor
                    operator: Exists
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: '{{.metadata.namespace}}'
    spec:
      project: '{{.spec.project}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  # ODF provides the object storage ACM observability needs, so acm syncs
  # the full apps/acm/manifests and, as a second source, the ODF object
  # storage (apps/object-storage/odf), which used to be part of it. A new grid generates its CA, and grid-bootstrap
  # binds global in place of the rhoai app's binding. acm-models brings the
  # console's catalog (its ApplicationSets and AppProjects), not its
  # GitOpsCluster: argo-registration registers clusters here. It also syncs
  # the opt-125m sample model from apps/acm-models-samples, which used to share
  # its directory, so the sample keeps its Application. This repository is also
  # the deployment repository: the lab's values are in values/. rhoai also
  # syncs the RBAC for the lab issuer's lookups (bootstrap/lab/rhoai).
  # Limitador runs on the sites, so limitador-redis leaves out its storage config.
  # ODF's operator channel follows the hub's OpenShift minor version.
  # A hub labelled ai-grid/odf-operatorgroup=existing keeps its own OperatorGroup.
  # acm-models and rhoai are kustomizations (their inputs), so they leave
  # objects out with $patch: delete patches rather than directory include or
  # exclude. Then every @<name>@ a component writes is replaced from $inputs,
  # JSON-escaped.
  templatePatch: |
    {{- $spec := .spec }}
    {{- if eq .metadata.name "grid-bootstrap" }}
    {{- range $spec.sources }}{{ if hasKey . "helm" }}
    {{- $_ := set .helm "parameters" (list (dict "name" "external.certManager.ca.mode" "value" "Generate") (dict "name" "managedClusters.createClusterSetBinding" "value" "true")) }}
    {{- end }}{{ end }}
    {{- end }}
    {{- if eq .metadata.name "odf" }}
    {{- $params := list (dict "name" "openshift.version" "value" (index .metadata.labels "openshiftVersion-major-minor")) }}
    {{- if eq (index .metadata.labels "ai-grid/odf-operatorgroup") "existing" }}
    {{- $params = append $params (dict "name" "operatorGroup.create" "value" "false") }}
    {{- end }}
    {{- $_ := set $spec.source.helm "parameters" $params }}
    {{- end }}
    {{- if eq .metadata.name "acm-models" }}
    {{- $deletes := list
          "$patch: delete\napiVersion: apps.open-cluster-management.io/v1beta1\nkind: GitOpsCluster\nmetadata:\n  name: acm-models\n  namespace: openshift-gitops\n"
          "$patch: delete\napiVersion: cluster.open-cluster-management.io/v1beta1\nkind: Placement\nmetadata:\n  name: acm-models-gitops-cluster\n  namespace: openshift-gitops\n" }}
    {{- $patches := $spec.source.kustomize.patches }}
    {{- range $deletes }}{{ $patches = append $patches (dict "patch" .) }}{{ end }}
    {{- $_ := set $spec.source.kustomize "patches" $patches }}
    {{- $samples := dict "repoURL" "@libraryRepoURL@" "targetRevision" "@libraryRevision@" "path" "apps/acm-models-samples/hub"
          "kustomize" (dict "patches" (list (dict "target" (dict "kind" "ConfigMap" "name" "library-inputs")
            "patch" "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: library-inputs\ndata:\n  libraryRepoURL: '@libraryRepoURL@'\n  libraryRevision: '@libraryRevision@'\n"))) }}
    {{- $_ := set $spec "sources" (list $spec.source $samples) }}
    {{- $_ := unset $spec "source" }}
    {{- end }}
    {{- if eq .metadata.name "limitador-redis" }}
    {{- $_ := set $spec.source "directory" (dict "exclude" "{04-limitador-redis-secret.yaml,20-limitador-storage.yaml}") }}
    {{- end }}
    {{- if eq .metadata.name "rhoai" }}
    {{- $_ := set $spec.source.kustomize "patches" (append $spec.source.kustomize.patches (dict "patch" "$patch: delete\napiVersion: cluster.open-cluster-management.io/v1beta2\nkind: ManagedClusterSetBinding\nmetadata:\n  name: global\n  namespace: redhat-ai-grid\n")) }}
    {{- $lookups := dict "repoURL" "@libraryRepoURL@" "targetRevision" "@libraryRevision@" "path" "bootstrap/lab/rhoai" }}
    {{- $_ := set $spec "sources" (list $spec.source $lookups) }}
    {{- $_ := unset $spec "source" }}
    {{- end }}
    {{- if eq .metadata.name "acm" }}
    {{- $storage := dict "repoURL" "@libraryRepoURL@" "targetRevision" "@libraryRevision@" "path" "apps/object-storage/odf/manifests" }}
    {{- $_ := set $spec "sources" (list $spec.source $storage) }}
    {{- $_ := unset $spec "source" }}
    {{- end }}
    {{- $inputs := merge (dict "libraryRepoURL" .values.repoURL "libraryRevision" .values.targetRevision
          "deploymentRepoURL" .values.repoURL "deploymentRevision" .values.targetRevision) (omit .values "repoURL" "targetRevision") }}
    {{- $json := toJson $spec }}
    {{- range $name, $value := $inputs }}
    {{- $json = replace (printf "@%s@" $name) (toJson $value | trimPrefix "\"" | trimSuffix "\"") $json }}
    {{- end }}
    spec: {{ $json }}
