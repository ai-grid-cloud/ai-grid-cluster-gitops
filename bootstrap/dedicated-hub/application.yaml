apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Generated by the root ApplicationSet so that the ApplicationSet manages
  # itself: edits to the generator list or templatePatch are applied
  # automatically. It syncs only applicationset.yaml, without automated pruning.
  name: dedicated-hub-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/jeffdyoung/ai-grid-cluster-gitops.git
    targetRevision: jeyounghub1
    path: bootstrap/dedicated-hub
    directory:
      include: applicationset.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
