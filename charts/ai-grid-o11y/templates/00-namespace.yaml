# The usage-logs Perses dashboard and datasource live here; CreateNamespace covers only the destination namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # RHOAI's monitoring namespace: this app must never prune or delete it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
