# Every input a deployment sets in the root ApplicationSet's generator values,
# with distinct fake values. inputs_test.py substitutes these for @<name>@ and
# checks that each component resolves to them and to nothing else.
libraryRepoURL: https://example.invalid/library.git
libraryRevision: 0123456789abcdef0123456789abcdef01234567
catalogRepoURL: https://example.invalid/catalog.git
catalogRevision: catalog-revision
deploymentRepoURL: https://example.invalid/deployment.git
deploymentRevision: deployment-revision
idpIssuerURL: https://idp.example.invalid/realms/sample-realm
idpClientID: sample-client-id
idpClientSecretNamespace: sample-secret-namespace
idpClientSecretName: sample-secret-name
idpClientSecretKey: sample-secret-key
idpCANamespace: sample-ca-namespace
idpCAName: sample-ca-name
idpCAKey: sample-ca-key
