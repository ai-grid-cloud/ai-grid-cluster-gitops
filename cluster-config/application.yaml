apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ai-grid-cloud/ai-grid-tenant.git
    targetRevision: HEAD
    path: cluster-config/hub
    # The nested ApplicationSet reads the admin list from the deployment
    # repository. The root ApplicationSet fills these tokens in, and the
    # generator's values hand them to the template as .values.*.
    kustomize:
      patches:
        - target:
            group: argoproj.io
            kind: ApplicationSet
            name: cluster-config
          patch: |-
            - op: add
              path: /spec/generators/0/clusters/values
              value:
                deploymentRepoURL: '@deploymentRepoURL@'
                deploymentRevision: '@deploymentRevision@'
                deploymentPath: '@deploymentPath@'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
