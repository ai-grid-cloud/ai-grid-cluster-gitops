# Users granted cluster-admin on the hub through the `ai-grid-admins` Group and
# its `cluster-admin-ai-grid-admins` ClusterRoleBinding (hub-only; see
# clusterrolebinding.yaml). Empty by default: a deployment lists its own users
# in its repository's values/cluster-admins.yaml, which the ApplicationSet
# requires (cluster_admins: [] for none). Editing the list edits Group
# membership; the binding is unaffected.
# The `cluster-admins` Group itself is managed by OCM, not Git.
#
# Entries must be Kubernetes usernames; Group members are not constrained to
# DNS-1123 resource names, so IdP-qualified names such as "user@domain" are
# valid.
cluster_admins: []

hubResources:
  enabled: false
