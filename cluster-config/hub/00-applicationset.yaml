apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-config
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'cluster-config-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: REQUIRED-libraryRepoURL
          targetRevision: REQUIRED-libraryRevision
          path: cluster-config/chart
          helm:
            releaseName: cluster-admins
            # The deployment's values/cluster-admins.yaml is required: a missing
            # or misspelled file fails the sync instead of rendering no binding
            # and pruning every cluster-admin. For none, it holds
            # cluster_admins: [].
            valueFiles:
              - $values/cluster-config/values.yaml
              - $deployment/values/cluster-admins.yaml
            parameters:
              - name: hubResources.enabled
                value: '{{ eq (index .metadata.labels "local-cluster") "true" | toString }}'
        - repoURL: REQUIRED-libraryRepoURL
          targetRevision: REQUIRED-libraryRevision
          ref: values
        - repoURL: REQUIRED-deploymentRepoURL
          targetRevision: REQUIRED-deploymentRevision
          ref: deployment
      destination:
        server: '{{ if eq (index .metadata.labels "local-cluster") "true" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
