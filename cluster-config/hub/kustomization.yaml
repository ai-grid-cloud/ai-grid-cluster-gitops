# A kustomization so cluster-config/application.yaml can hand the
# ApplicationSet the library's repository and revision (inputs.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - inputs.yaml
  - 00-applicationset.yaml
replacements:
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRepoURL
    targets:
      - select:
          kind: ApplicationSet
          name: cluster-config
        fieldPaths:
          - spec.template.spec.sources.[path=cluster-config/chart].repoURL
          - spec.template.spec.sources.[ref=values].repoURL
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRevision
    targets:
      - select:
          kind: ApplicationSet
          name: cluster-config
        fieldPaths:
          - spec.template.spec.sources.[path=cluster-config/chart].targetRevision
          - spec.template.spec.sources.[ref=values].targetRevision
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.deploymentRepoURL
    targets:
      - select:
          kind: ApplicationSet
          name: cluster-config
        fieldPaths:
          - spec.template.spec.sources.[ref=deployment].repoURL
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.deploymentRevision
    targets:
      - select:
          kind: ApplicationSet
          name: cluster-config
        fieldPaths:
          - spec.template.spec.sources.[ref=deployment].targetRevision
