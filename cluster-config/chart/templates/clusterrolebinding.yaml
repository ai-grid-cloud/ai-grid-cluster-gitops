{{- /* A missing list fails, so a lost values file can't revoke every admin. An explicit
       empty list is a deployment that grants no one cluster-admin from git. */}}
{{- if not (hasKey .Values "cluster_admins") }}
{{- fail "cluster-admins: values must define 'cluster_admins' (an empty list grants no one)" }}
{{- end }}
{{- range $user := .Values.cluster_admins }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admin-{{ $user }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user }}
{{- end }}
