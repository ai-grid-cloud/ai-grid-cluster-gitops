apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: limitador-redis
  namespace: limitador-redis
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  clusterSize: 3
  livenessProbe:
    exec:
      # Authenticated: with a password set, an unauthenticated PING gets NOAUTH.
      command:
        - sh
        - -c
        - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 -p 6379 ping | grep -qx PONG'
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    exec:
      # Authenticated: with a password set, an unauthenticated PING gets NOAUTH.
      command:
        - sh
        - -c
        - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 -p 6379 ping | grep -qx PONG'
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  redisConfig:
    dynamicConfig:
      - "maxmemory 6gb"
      - "maxmemory-policy noeviction"
  kubernetesConfig:
    image: registry.redhat.io/rhel9/redis-7@sha256:8e0c52a2f304473c1f62d1112e116e0e8d541ed9cbeea86f6ece3318146be105
    imagePullPolicy: IfNotPresent
    # requirepass, from the Secret Job limitador-redis-auth fills (04-limitador-redis-auth.yaml).
    redisSecret:
      name: limitador-redis-auth
      key: password
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  sentinel:
    size: 3
    image: registry.redhat.io/rhel9/redis-7@sha256:8e0c52a2f304473c1f62d1112e116e0e8d541ed9cbeea86f6ece3318146be105
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: limitador-redis-auth
      key: password
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: limitador-redis
                redis_setup_type: replication
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: limitador-redis
          redis_setup_type: replication
