apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: limitador-redis-isolation
  namespace: limitador-redis
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - ipBlock:
            cidr: 242.0.0.0/8
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kuadrant-system
          podSelector:
            matchLabels:
              app: limitador
    # Admit the RHOAI collector to the exporter, without opening the Redis data port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: redhat-ods-monitoring.data-science-collector
      ports:
        - port: 9121
          protocol: TCP
