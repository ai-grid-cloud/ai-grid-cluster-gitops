# The Loki operator, a prerequisite of the hub store.
#
# The ai-grid-o11y-hub subchart renders the LokiStack but not the operator that
# reconciles it: that is the parent chart's dependencies.loki, and this
# Application targets the subchart directly. A dedicated hub runs no RHOAI, so
# nothing else brings it either.
#
# openshift-operators-redhat does not ship with OpenShift (absent on a fresh
# 4.21 hub); the Loki operator's install docs create it, labelled for cluster
# monitoring. Where it already exists, Argo applies the label to it. Prune=false
# and Delete=false keep Argo from ever removing it, since other Red Hat
# operators can share it.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-operators-redhat
  labels:
    openshift.io/cluster-monitoring: "true"
  annotations:
    openshift.io/node-selector: ""
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-operators-redhat
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # stable-6.5, matching the parent chart's dependencies.loki, so the hub and
  # the sites run the same Loki operator version.
  channel: stable-6.5
  name: loki-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
