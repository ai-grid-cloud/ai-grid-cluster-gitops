# The Loki operator, a prerequisite of the hub store.
#
# The ai-grid-o11y-hub subchart renders the LokiStack but not the operator that
# reconciles it: that is the parent chart's dependencies.loki, and this
# Application targets the subchart directly. A dedicated hub runs no RHOAI, so
# nothing else brings it either.
#
# openshift-operators-redhat ships with OpenShift, so it is NOT created here --
# Argo and Helm both refuse to adopt a namespace they do not own. It does arrive
# without an OperatorGroup, so that one is ours.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-operators-redhat
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # stable-6.5, matching the parent chart's dependencies.loki, so the hub and
  # the sites run the same Loki operator version.
  channel: stable-6.5
  name: loki-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
