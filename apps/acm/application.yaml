apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acm
  namespace: openshift-gitops
spec:
  project: default
  # ACM's own install (core's subscription, operator group and MultiClusterHub)
  # and its observability are the deployment's optional apps acm-install and
  # acm-observability: a hub can already have ACM, and its observability needs
  # object storage. This app keeps the policy add-ons and Submariner.
  sources:
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-tenant.git
      targetRevision: HEAD
      path: apps/acm/manifests/core
      directory:
        include: policy-addons.yaml
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-tenant.git
      targetRevision: HEAD
      path: apps/acm/manifests/submariner
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
