apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: acm-submariner
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'acm-submariner-{{ .name }}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
        targetRevision: HEAD
        path: apps/acm/submariner
        helm:
          releaseName: acm-submariner
          parameters:
            - name: clusterName
              value: '{{ .name }}'
            # A cluster with no load-balancer provider opts out with ai-grid/submariner-load-balancer=false.
            - name: loadBalancerEnable
              value: '{{ if eq (index .metadata.labels "ai-grid/submariner-load-balancer") "false" }}false{{ else }}true{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: open-cluster-management
      ignoreDifferences:
        - group: addon.open-cluster-management.io
          kind: ManagedClusterAddOn
          jsonPointers:
            - /metadata/finalizers
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
