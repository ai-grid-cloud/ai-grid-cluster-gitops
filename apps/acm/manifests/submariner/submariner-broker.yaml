apiVersion: submariner.io/v1alpha1
kind: Broker
metadata:
  name: submariner-broker
  namespace: default-broker
  labels:
    cluster.open-cluster-management.io/backup: submariner
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Globalnet is enabled because the cluster CIDRs are not centrally controlled
  # and may overlap. Submariner allocates global CIDRs and NATs cross-cluster
  # traffic, avoiding conflicts at the cost of additional translation overhead.
  globalnetEnabled: true
  globalnetCIDRRange: 242.0.0.0/8
  defaultGlobalnetClusterSize: 65536
