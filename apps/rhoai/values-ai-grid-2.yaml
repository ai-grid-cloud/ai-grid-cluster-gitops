# The serving config names this cluster's provider after a hash of the local
# LLMInferenceService UID, and grid_site_route can only select a cluster it
# declares, so the name is local to this file.
praxis-gateway:
  praxisConfig:
    render:
      backends:
        - cluster: grid-ai-grid-internal-models-faa71e071b1706382d340721b3ef0dccc5
          endpoints:
            - facebook-opt-125m-kserve-workload-svc.ai-grid-internal-models.svc.cluster.local.:8000
          transport:
            mode: tls
            ca:
              configMapName: openshift-service-ca.crt
              key: service-ca.crt
          # praxis refuses a name that resolves to a private address.
          trustPrivate: true
        - cluster: grid-ai-grid-internal-models-smd37e259ad73ccb45d2542563a47a1190
          endpoints:
            - smollm2-135m-instruct-kserve-workload-svc.ai-grid-internal-models.svc.cluster.local.:8000
          transport:
            mode: tls
            ca:
              configMapName: openshift-service-ca.crt
              key: service-ca.crt
          # praxis refuses a name that resolves to a private address.
          trustPrivate: true
        # The peer's router. No SNI here, so the chart defaults it to
        # local-cluster.grid.internal, which is also the peer's Route host.
        - cluster: peer-local-cluster
          site: local-cluster
          endpoints:
            - ai-grid-1.apps.ai-grid-1.qhdb.p1.openshiftapps.com:443
          transport:
            mode: mutual_tls
# The grid scrapes this cluster's llm-d EPP metrics over plain HTTP, because the
# EPP's metrics port has no TLS here. The credential is a short-lived TokenRequest
# token for grid-operator-metrics-scraper, which may only get the nonResourceURL
# /metrics (not grid-model-client's). Per cluster, not in values.yaml, so a new
# deployment doesn't inherit it. Remove once the EPP serves metrics over TLS and
# odh-model-controller switches to https.
components:
  kserve:
    gateway:
      annotations:
        grid.opendatahub.io/serving: >-
          {
            "networkName": "grid",
            "namespace": "redhat-ai-grid",
            "serviceAccount": "grid-model-client",
            "tokenSecret": "grid-model-client-token",
            "publishMetrics": true,
            "metricsAllowPlaintext": true
          }
