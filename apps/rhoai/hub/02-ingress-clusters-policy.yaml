apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-ingress-clusters
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: rhoai-tenant-templating
  policy-templates:
    # The tenant IdP is an input (apps/rhoai/hub/inputs.yaml): its issuer, its
    # client, the hub Secret holding the client's secret, and the hub ConfigMap
    # holding the CA that signs the issuer's certificate. The hub templates read
    # the Secret and ConfigMap as rhoai-tenant-templating
    # (00-tenant-templating-rbac.yaml). apps/keycloak/README.md has the contract.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-tenant-idp-ca
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - kuadrant-system
          object-templates:
            # Its own key: Authorino mounts this ConfigMap in one directory with
            # odh-trusted-ca-bundle, whose key is ca-bundle.crt, and a second
            # ca-bundle.crt would replace the system bundle (an issuer behind a
            # public certificate then fails OIDC discovery). mustonlyhave drops
            # the old key from existing ConfigMaps.
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: home-keycloak-ca
                  namespace: kuadrant-system
                binaryData:
                  home-keycloak-ca.crt: '{{hub fromConfigMap "REQUIRED-idpCANamespace" "REQUIRED-idpCAName" "REQUIRED-idpCAKey" | base64enc hub}}'

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-authorino-home-keycloak-ca
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - kuadrant-system
          object-templates-raw: |
            {{- if (lookup "operator.authorino.kuadrant.io/v1beta1" "Authorino" "kuadrant-system" "authorino") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.authorino.kuadrant.io/v1beta1
                kind: Authorino
                metadata:
                  name: authorino
                  namespace: kuadrant-system
                spec:
                  volumes:
                    defaultMode: 420
                    items:
                      - name: trusted-ca-bundle
                        mountPath: /etc/pki/tls/certs
                        configMaps:
                          - odh-trusted-ca-bundle
                          - openshift-service-ca.crt
                          - home-keycloak-ca
            {{- end }}

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-tenant-oidc-client-secret
        spec:
          remediationAction: enforce
          severity: high
          # The AITenant's tenant namespace (its status.tenantNamespace, where
          # rhoai-maastenantconfig puts the MaasTenantConfig), not the AITenant's
          # own namespace: ai-gateway-controller reads spec.oidc.clientSecretRef
          # there.
          namespaceSelector:
            include:
              - models-as-a-service
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: tenant-demo-oidc-client
                  namespace: models-as-a-service
                type: Opaque
                data:
                  clientSecret: '{{hub fromSecret "REQUIRED-idpClientSecretNamespace" "REQUIRED-idpClientSecretName" "REQUIRED-idpClientSecretKey" hub}}'

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-aitenant
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - ai-tenants
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: AITenant
                metadata:
                  name: models-as-a-service
                  namespace: ai-tenants
                  annotations:
                    maas.opendatahub.io/retain-api-keys-on-delete: "true"
                spec:
                  gateway:
                    name: maas-default-gateway
                  oidc:
                    accessTokenPurpose: access
                    accessTokenPurposeClaim: token_use
                    # MaaS matches the token's azp against clientId.
                    clientId: REQUIRED-idpClientID
                    audience: REQUIRED-idpClientID
                    clientSecretRef:
                      name: tenant-demo-oidc-client
                      key: clientSecret
                    issuerUrl: REQUIRED-idpIssuerURL

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-maastenantconfig
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - models-as-a-service
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaasTenantConfig
                metadata:
                  name: default-tenant
                  namespace: models-as-a-service
                spec:
                  telemetry:
                    enabled: true
                    metrics:
                      captureModelUsage: true
                      captureUser: true
                      captureGroup: true
                      captureOrganization: true
                    logs:
                      captureUser: true
                      captureOrganization: true

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-grid-external-provider
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - models-as-a-service
          object-templates:
            # Fake API Key for external model -> local Grid GW connection
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-maas-upstream
                  namespace: models-as-a-service
                  annotations:
                    argocd.argoproj.io/sync-wave: "1"
                type: Opaque
                stringData:
                  api-key: "dW51c2VkLWJ5LWNsdXN0ZXItbG9jYWwtZ3JpZA=="

            - complianceType: musthave
              objectDefinition:
                apiVersion: inference.opendatahub.io/v1alpha1
                kind: ExternalProvider
                metadata:
                  annotations:
                    inference.opendatahub.io/port: "443"
                    inference.opendatahub.io/tls: "true"
                    argocd.argoproj.io/sync-wave: "2"
                  name: grid-provider
                  namespace: models-as-a-service
                spec:
                  auth:
                    secretRef:
                      name: grid-maas-upstream
                    type: apikey
                  endpoint: grid-gateway.redhat-ai-grid.svc.cluster.local
                  provider: openai
                  config:
                    # Verify the gateway's service-ca certificate. A path already mounted in the
                    # calling proxy; the controller never reads certificate bytes.
                    tls.caCertificates: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
