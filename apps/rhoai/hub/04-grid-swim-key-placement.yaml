# The hub holds the key the bootstrap generated, so it is the source and never a target.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-remote-clusters
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  # Every AI Grid spoke but the hub, where grid enrollment keeps the key.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            - key: name
              operator: NotIn
              values:
                - local-cluster
