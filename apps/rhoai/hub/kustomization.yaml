# A kustomization so apps/rhoai/application.yaml can hand the ApplicationSet
# the library's and the deployment's repositories and revisions, and the
# tenant IdP's coordinates for the tenant Policy and its RBAC (inputs.yaml).
# The hub-template strings take the Secret's and ConfigMap's namespace, name
# and key as the 1st, 3rd and 5th '"'-delimited parts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - inputs.yaml
  - 00-managed-cluster-set-binding-grid.yaml
  - 00-tenant-templating-rbac.yaml
  - 01-applicationset.yaml
  - 02-ingress-clusters-policy.yaml
  - 03-ingress-clusters-placement.yaml
replacements:
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRepoURL
    targets:
      - select:
          kind: ApplicationSet
          name: rhoai
        fieldPaths:
          - spec.template.spec.sources.[ref=values].repoURL
          - spec.template.spec.sources.[path=apps/rhoai/gateway-hostname].repoURL
          - spec.template.spec.sources.[path=apps/rhoai/catalog].repoURL
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRevision
    targets:
      - select:
          kind: ApplicationSet
          name: rhoai
        fieldPaths:
          - spec.template.spec.sources.[ref=values].targetRevision
          - spec.template.spec.sources.[path=apps/rhoai/gateway-hostname].targetRevision
          - spec.template.spec.sources.[path=apps/rhoai/catalog].targetRevision
          - spec.template.metadata.annotations.ai-grid/library-revision
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.deploymentRepoURL
    targets:
      - select:
          kind: ApplicationSet
          name: rhoai
        fieldPaths:
          - spec.template.spec.sources.[ref=deployment].repoURL
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.deploymentRevision
    targets:
      - select:
          kind: ApplicationSet
          name: rhoai
        fieldPaths:
          - spec.template.spec.sources.[ref=deployment].targetRevision
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.idpIssuerURL
    targets:
      - select:
          kind: Policy
          name: rhoai-ingress-clusters
        fieldPaths:
          - spec.policy-templates.3.objectDefinition.spec.object-templates.0.objectDefinition.spec.oidc.issuerUrl
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.idpClientID
    targets:
      - select:
          kind: Policy
          name: rhoai-ingress-clusters
        fieldPaths:
          - spec.policy-templates.3.objectDefinition.spec.object-templates.0.objectDefinition.spec.oidc.clientId
          - spec.policy-templates.3.objectDefinition.spec.object-templates.0.objectDefinition.spec.oidc.audience
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.idpClientSecretNamespace
    targets:
      - select:
          kind: Policy
          name: rhoai-ingress-clusters
        fieldPaths:
          - spec.policy-templates.2.objectDefinition.spec.object-templates.0.objectDefinition.data.clientSecret
        options:
          delimiter: '"'
          index: 1
      - select:
          kind: Role
          name: rhoai-tenant-idp-client-secret
        fieldPaths:
          - metadata.namespace
      - select:
          kind: RoleBinding
          name: rhoai-tenant-idp-client-secret
        fieldPaths:
          - metadata.namespace
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.idpClientSecretName
    targets:
      - select:
          kind: Policy
          name: rhoai-ingress-clusters
        fieldPaths:
          - spec.policy-templates.2.objectDefinition.spec.object-templates.0.objectDefinition.data.clientSecret
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: Role
          name: rhoai-tenant-idp-client-secret
        fieldPaths:
          - rules.0.resourceNames.0
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.idpClientSecretKey
    targets:
      - select:
          kind: Policy
          name: rhoai-ingress-clusters
        fieldPaths:
          - spec.policy-templates.2.objectDefinition.spec.object-templates.0.objectDefinition.data.clientSecret
        options:
          delimiter: '"'
          index: 5
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.idpCANamespace
    targets:
      - select:
          kind: Policy
          name: rhoai-ingress-clusters
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.0.objectDefinition.binaryData.[home-keycloak-ca.crt]
        options:
          delimiter: '"'
          index: 1
      - select:
          kind: Role
          name: rhoai-tenant-idp-ca
        fieldPaths:
          - metadata.namespace
      - select:
          kind: RoleBinding
          name: rhoai-tenant-idp-ca
        fieldPaths:
          - metadata.namespace
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.idpCAName
    targets:
      - select:
          kind: Policy
          name: rhoai-ingress-clusters
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.0.objectDefinition.binaryData.[home-keycloak-ca.crt]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: Role
          name: rhoai-tenant-idp-ca
        fieldPaths:
          - rules.0.resourceNames.0
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.idpCAKey
    targets:
      - select:
          kind: Policy
          name: rhoai-ingress-clusters
        fieldPaths:
          - spec.policy-templates.0.objectDefinition.spec.object-templates.0.objectDefinition.binaryData.[home-keycloak-ca.crt]
        options:
          delimiter: '"'
          index: 5
