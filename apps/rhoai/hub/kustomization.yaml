# A kustomization so apps/rhoai/application.yaml can hand the ApplicationSet
# the library's repository and revision (inputs.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - inputs.yaml
  - 00-managed-cluster-set-binding-grid.yaml
  - 00-tenant-templating-rbac.yaml
  - 01-applicationset.yaml
  - 02-ingress-clusters-policy.yaml
  - 03-ingress-clusters-placement.yaml
replacements:
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRepoURL
    targets:
      - select:
          kind: ApplicationSet
          name: rhoai
        fieldPaths:
          - spec.template.spec.sources.[ref=values].repoURL
          - spec.template.spec.sources.[path=apps/rhoai/gateway-hostname].repoURL
          - spec.template.spec.sources.[path=apps/rhoai/catalog].repoURL
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRevision
    targets:
      - select:
          kind: ApplicationSet
          name: rhoai
        fieldPaths:
          - spec.template.spec.sources.[ref=values].targetRevision
          - spec.template.spec.sources.[path=apps/rhoai/gateway-hostname].targetRevision
          - spec.template.spec.sources.[path=apps/rhoai/catalog].targetRevision
          - spec.template.metadata.annotations.ai-grid/library-revision
