apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhoai-tenant-templating
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
# Finds the MaaS home, which holds Keycloak when it is not the hub.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-tenant-templating
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - managedclusters
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-tenant-templating
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: rhoai-tenant-templating
    namespace: redhat-ai-grid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-tenant-templating
