# The tenant Policy's hub templates (02-ingress-clusters-policy.yaml) run as
# this ServiceAccount, which may read only the tenant IdP inputs: the Secret
# holding the client's secret and the ConfigMap holding the issuer's CA. Their
# namespaces and names come from inputs.yaml through kustomization.yaml.
#
# Every verb is limited to the input's name. ACM resolves a hub template's
# fromSecret or fromConfigMap with a get, then a list and watch carrying the
# field selector metadata.name=<name> (stolostron/kubernetes-dependency-watches
# client/client.go, watchLatest), and Kubernetes RBAC authorizes such a list
# or watch by resourceNames. So no rule covers the whole namespace, which may
# hold other Secrets, such as the IdP's own admin credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhoai-tenant-templating
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-tenant-idp-client-secret
  namespace: REQUIRED-idpClientSecretNamespace
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - REQUIRED-idpClientSecretName
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-tenant-idp-client-secret
  namespace: REQUIRED-idpClientSecretNamespace
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: rhoai-tenant-templating
    namespace: redhat-ai-grid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-tenant-idp-client-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-tenant-idp-ca
  namespace: REQUIRED-idpCANamespace
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - REQUIRED-idpCAName
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-tenant-idp-ca
  namespace: REQUIRED-idpCANamespace
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: rhoai-tenant-templating
    namespace: redhat-ai-grid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-tenant-idp-ca
