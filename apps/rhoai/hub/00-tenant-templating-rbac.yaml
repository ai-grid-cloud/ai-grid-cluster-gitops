apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhoai-tenant-templating
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
# The tenant Policy's hub templates run as rhoai-tenant-templating, so they
# read the deployment's tenant-oidc ConfigMap through this Role. A hub-template
# lookup lists and watches even a named object (upstream 83820a0).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-tenant-templating
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - rhoai-tenant-oidc
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-tenant-templating
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: rhoai-tenant-templating
    namespace: redhat-ai-grid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-tenant-templating
