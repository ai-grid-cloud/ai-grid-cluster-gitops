apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # One provider gateway per site where models run (the ai-grid-inference
  # Placement: role inference or combined) that has
  # <deployment>/clusters/<cluster>/provider-gateway.yaml.
  # Kept out of the rhoai Application so a new cluster installs RHOAI without that file.
  name: grid-provider-gateway
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  syncPolicy:
    # Removing the label stops managing a cluster's workloads; it does not uninstall them.
    preserveResourcesOnDeletion: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # The Placement's live decisions joined with Argo CD's cluster Secret
          # for the server, as in the rhoai ApplicationSet.
          - matrix:
              generators:
                - clusterDecisionResource:
                    configMapRef: acm-placement
                    labelSelector:
                      matchLabels:
                        cluster.open-cluster-management.io/placement: ai-grid-inference
                    requeueAfterSeconds: 60
                - clusters:
                    selector:
                      matchLabels:
                        apps.open-cluster-management.io/acm-cluster: "true"
                        name: '{{ .clusterName }}'
          # apps/rhoai/application.yaml sets this generator's repository,
          # revision and path to the deployment repository's.
          - git:
              repoURL: https://deployment.invalid/set-by-apps-rhoai-application.git
              revision: HEAD
              files:
                - path: 'deployment/clusters/{{ .name }}/provider-gateway.yaml'
  template:
    metadata:
      name: 'grid-provider-gateway-{{ .name | trunc 30 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: '{{ .values.deploymentRepoURL }}'
          targetRevision: '{{ .values.deploymentRevision }}'
          ref: deployment
        - repoURL: https://github.com/opendatahub-io/odh-gitops.git
          targetRevision: feature-ai-grid
          path: charts/rhai-on-openshift-chart/charts/praxis-gateway
          helm:
            releaseName: grid-provider-gateway
            valueFiles:
              - $deployment/{{ .values.deploymentPath }}/clusters/{{ .name }}/provider-gateway.yaml
            parameters:
              - name: grid.siteName
                value: '{{ .name }}'
        # The models Gateway the provider gateway forwards to, which routes
        # each model by name (apps/rhoai/grid-models/gateway.yaml). Where a
        # cluster has a provider gateway, it has this Gateway too.
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/grid-models
      # Same destination rule as the rhoai Applications: the hub through Argo's in-cluster server.
      destination:
        server: '{{ if eq .name "local-cluster" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: redhat-ai-grid
      ignoreDifferences:
        - group: ""
          kind: Service
          name: grid-provider-gateway
          namespace: redhat-ai-grid
          jsonPointers:
            - /spec/type
          jqPathExpressions:
            - '.metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]'
            - '.metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]'
            - '.spec.ports[] | select(.name == "http") | .nodePort'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          - CreateNamespace=false
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
