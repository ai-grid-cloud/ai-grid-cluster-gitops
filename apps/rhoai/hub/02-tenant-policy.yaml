apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-tenant
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: rhoai-tenant-templating
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-aitenant
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - ai-tenants
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: AITenant
                metadata:
                  name: models-as-a-service
                  namespace: ai-tenants
                spec:
                  gateway:
                    name: maas-default-gateway
                  oidc:
                    accessTokenPurpose: access
                    accessTokenPurposeClaim: token_use
                    # The deployment's IdP: <deployment>/hub/tenant-oidc.yaml. Without
                    # issuerUrl there, the issuer is its Keycloak's Route host.
                    clientId: '{{hub fromConfigMap "redhat-ai-grid" "rhoai-tenant-oidc" "clientId" hub}}'
                    audience: '{{hub fromConfigMap "redhat-ai-grid" "rhoai-tenant-oidc" "audience" hub}}'
                    issuerUrl: '{{hub with fromConfigMap "redhat-ai-grid" "rhoai-tenant-oidc" "issuerUrl" hub}}{{hub . hub}}{{hub else hub}}{{hub printf "https://%s/realms/%s" (index (lookup "route.openshift.io/v1" "Route" "maas-db" "keycloak").status.ingress 0).host (fromConfigMap "redhat-ai-grid" "rhoai-tenant-oidc" "realm") hub}}{{hub end hub}}'

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-maastenantconfig
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - models-as-a-service
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaasTenantConfig
                metadata:
                  name: default-tenant
                  namespace: models-as-a-service
                spec:
                  telemetry:
                    enabled: true
                    metrics:
                      captureModelUsage: true
                      captureUser: true
                      captureGroup: true
                      captureOrganization: true
                    logs:
                      captureUser: true
                      captureOrganization: true

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-grid-external-provider
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - models-as-a-service
          object-templates:
            # Fake API Key for external model -> local Grid GW connection
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-maas-upstream
                  namespace: models-as-a-service
                  annotations:
                    argocd.argoproj.io/sync-wave: "1"
                type: Opaque
                stringData:
                  api-key: "dW51c2VkLWJ5LWNsdXN0ZXItbG9jYWwtZ3JpZA=="

            - complianceType: musthave
              objectDefinition:
                apiVersion: inference.opendatahub.io/v1alpha1
                kind: ExternalProvider
                metadata:
                  annotations:
                    inference.opendatahub.io/port: "443"
                    inference.opendatahub.io/tls: "true"
                    argocd.argoproj.io/sync-wave: "2"
                  name: grid-provider
                  namespace: models-as-a-service
                spec:
                  auth:
                    secretRef:
                      name: grid-maas-upstream
                    type: apikey
                  endpoint: grid-gateway.redhat-ai-grid.svc.cluster.local
                  provider: openai
                  config:
                    # Verify the gateway's service-ca certificate. A path already mounted in the
                    # calling proxy; the controller never reads certificate bytes.
                    tls.caCertificates: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
