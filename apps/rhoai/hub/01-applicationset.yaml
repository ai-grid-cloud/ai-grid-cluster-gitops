apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # One Application per AI Grid site: a ManagedCluster labelled
  # ai-grid/enabled=true with an ai-grid/role (apps/ai-grid-spokes). The role
  # picks the values layer (apps/rhoai/roles/<role>.yaml).
  name: rhoai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  syncPolicy:
    # Removing the label stops managing a cluster's workloads; it does not uninstall them.
    preserveResourcesOnDeletion: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # A cluster gets RHOAI by joining the grid. Membership comes from the
    # ai-grid-spokes Placement's decisions, read live, joined with Argo CD's
    # cluster Secret for the server and labels. Not the Secret's labels alone:
    # ACM copies a ManagedCluster's labels onto the Secret but never removes
    # one, so a cluster whose ai-grid/enabled label is removed would keep its
    # Application.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-spokes
              requeueAfterSeconds: 60
          - clusters:
              # The role too: membership comes from the Placement, but the
              # role is read from this Secret, which ACM labels a moment later.
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
                matchExpressions:
                  - key: ai-grid/role
                    operator: In
                    values: [ingress, inference, combined]
  template:
    metadata:
      name: 'rhoai-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
      annotations:
        # The library revision this site's OpenShift AI comes from, so the hub
        # shows which revision each site runs (kustomization.yaml fills it in).
        # An annotation, not a label: a revision can be a branch name that
        # isn't a valid label value.
        ai-grid/library-revision: REQUIRED-libraryRevision
    spec:
      project: default
      sources:
        - repoURL: REQUIRED-libraryRepoURL
          targetRevision: REQUIRED-libraryRevision
          ref: values
        # Immutable OCI snapshot from the 3.6.0 dev channel.
        - repoURL: oci://ghcr.io/opendatahub-io/odh-gitops/rhai-on-openshift-chart
          targetRevision: 3.6.0-dev.32.1
          path: .
          helm:
            releaseName: rhai-on-openshift
            # A per-cluster file is optional, for a temporary override such as an image pin.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/apps/rhoai/values.yaml
              # The site's role (ai-grid/role): ingress, inference or combined.
              - '$values/apps/rhoai/roles/{{ index .metadata.labels "ai-grid/role" }}.yaml'
              - $values/apps/rhoai/values-{{ .name }}.yaml
            parameters:
              - name: praxis-gateway.grid.siteName
                value: '{{ .name }}'
              - name: praxis-provider-gateway.grid.siteName
                value: '{{ .name }}'
              # OSD ships these namespaces; a self-managed spoke has no creator.
              - name: operator.rhoai.olm.createNamespace
                value: '{{ ne (index .metadata.labels "local-cluster") "true" | toString }}'
              # openshift-operators-redhat is platform-owned on managed OpenShift: such a
              # cluster carries ai-grid/platform-namespaces=true (set before upgrading).
              - name: dependencies.loki.olm.createNamespace
                value: '{{ if eq (index .metadata.labels "ai-grid/platform-namespaces") "true" }}false{{ else }}true{{ end }}'
              # RHOAIENG-99507: on the hub, RHACM's multicluster-observability-addon
              # installs Cluster Observability Operator with its own OperatorGroup,
              # which conflicts with the chart's (named after the package) and blocks
              # CSV installs/upgrades, so the hub must leave the chart's COO off. That
              # addon does not install COO on a managed spoke -- it ships only the
              # prom-agent collectors -- so without this the spoke has no COO, RHOAI's
              # Monitoring service stays PreconditionsFailed, no collector is created
              # and usage logs never forward. Let the chart own COO on spokes, and
              # RHACM own it on the hub.
              - name: dependencies.clusterObservability.enabled
                value: '{{ ne (index .metadata.labels "local-cluster") "true" | toString }}'
            values: |
              praxis-gateway:
                networkPolicy:
                  from:
                    - podSelector:
                        matchLabels:
                          grid.opendatahub.io/gateway-client: "true"
                    - namespaceSelector:
                        matchLabels:
                          network.openshift.io/policy-group: ingress
              praxis-provider-gateway:
                networkPolicy:
                  from:
                    - podSelector:
                        matchLabels:
                          grid.opendatahub.io/gateway-client: "true"
                    - namespaceSelector:
                        matchLabels:
                          network.openshift.io/policy-group: ingress
                    {{- with index .metadata.labels "ai-grid/machine-network" }}
                    - ipBlock:
                        {{- if regexMatch "^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])_([1-9]|[12][0-9]|3[0-2])$" . }}
                        cidr: {{ replace "_" "/" . | quote }}
                        {{- else }}
                        cidr: {{ printf "invalid ai-grid/machine-network label %s" . | quote }}
                        {{- end }}
                    {{- end }}
        - repoURL: REQUIRED-libraryRepoURL
          targetRevision: REQUIRED-libraryRevision
          path: apps/rhoai/gateway-hostname
          helm:
            releaseName: rhoai-gateway-hostname
            valueFiles:
              - $values/apps/rhoai/values.yaml
            parameters:
              - name: clusterNamespace
                value: '{{ .name }}'
                forceString: true
              # An inference-only site has no MaaS Gateway: the chart renders nothing there.
              - name: role
                value: '{{ index .metadata.labels "ai-grid/role" }}'
                forceString: true
        - repoURL: REQUIRED-libraryRepoURL
          targetRevision: REQUIRED-libraryRevision
          path: apps/rhoai/catalog
          helm:
            releaseName: rhoai-nightly-catalog
            valueFiles:
              - $values/apps/rhoai/nightly.yaml
      # The hub resolves to Argo's own in-cluster destination. Routing it back
      # through the cluster-proxy applies as the ACM addon ServiceAccount, which
      # the managed-cluster webhooks deny on redhat-* namespaces and on every
      # NetworkPolicy. Argo's controller ServiceAccount is allowed both.
      destination:
        server: '{{ if eq (index .metadata.labels "local-cluster") "true" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: redhat-ai-grid
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: maas-default-gateway
          namespace: openshift-ingress
          jqPathExpressions:
            - '.spec.listeners[] | select(.name == "http") | .hostname'
            - '.spec.listeners[] | select(.name == "https") | .hostname'
        # OpenShift injects a generated dockercfg pull secret into this
        # OLM-owned ServiceAccount. Ignore only that controller-generated entry
        # so Argo still owns the explicit catalog pull secret.
        - group: ""
          kind: ServiceAccount
          name: rhoai-catalog-dev
          namespace: openshift-marketplace
          jqPathExpressions:
            - '.imagePullSecrets[] | select(.name | startswith("rhoai-catalog-dev-dockercfg-"))'
        - group: ""
          kind: Secret
          name: grid-model-client-token
          namespace: redhat-ai-grid
          jsonPointers:
            - /data
            - /metadata/annotations
        # apps/ai-grid-usage-logs delivers spec.monitoring.usageLogs through an
        # ACM Policy, because the ingest endpoint is the hub's Route host and is
        # not knowable at render time. Without this, Argo's selfHeal and that
        # policy fight over one object every cycle. Argo still owns the rest of
        # spec.monitoring -- metrics, traces and log forwarding.
        - group: dscinitialization.opendatahub.io
          kind: DSCInitialization
          name: default-dsci
          jsonPointers:
            - /spec/monitoring/usageLogs
        - group: ""
          kind: Service
          name: grid-provider-gateway
          namespace: redhat-ai-grid
          jsonPointers:
            - /spec/type
          jqPathExpressions:
            - '.metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]'
            - '.metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]'
            - '.spec.ports[] | select(.name == "http") | .nodePort'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          # Protected Namespaces are owned by ACM or the platform, and the
          # chart omits them through createNamespace=false.
          - CreateNamespace=false
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
