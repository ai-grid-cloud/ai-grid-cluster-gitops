apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # One Application per AI Grid spoke: a cluster the ai-grid-spokes Placement
  # selects (apps/ai-grid-spokes), the hub included only when it's labelled.
  name: rhoai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The Placement's decisions, read live, joined with Argo CD's cluster Secret
    # for the server and labels (apps/ai-grid-spokes explains why both).
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-spokes
              requeueAfterSeconds: 60
          - clusters:
              # The role too: membership comes from the Placement, but the role
              # is read from this Secret, which ACM labels a moment later.
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
                matchExpressions:
                  - key: ai-grid/role
                    operator: In
                    values: [ingress, inference, combined]
  template:
    metadata:
      name: 'rhoai-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://github.com/ai-grid-cloud/ai-grid-tenant.git
          targetRevision: HEAD
          ref: values
        # Temporary v0.3.0-rc.1 schemas until the RHOAI manifest bundle catches up.
        # The overlay hands CRD management to Argo and protects them from pruning.
        # See odh-gitops/components/ai-grid-crds/README.md for the ownership handoff.
        - repoURL: https://github.com/opendatahub-io/odh-gitops.git
          targetRevision: feature-ai-grid
          path: components/ai-grid-crds
        # Cluster values, hostnames and hub objects of this deployment
        # (bootstrap.sh DEPLOYMENT_REPO_URL, DEPLOYMENT_REVISION, DEPLOYMENT_PATH).
        - repoURL: '{{ .values.deploymentRepoURL }}'
          targetRevision: '{{ .values.deploymentRevision }}'
          ref: deployment
        # Pinned to a feature branch carrying operator.olm.createNamespace until
        # the change is available upstream. This lets ACM own protected
        # Namespaces while the chart still owns the OLM operator resources.
        - repoURL: https://github.com/opendatahub-io/odh-gitops.git
          targetRevision: feature-ai-grid
          path: charts/rhai-on-openshift-chart
          helm:
            releaseName: rhai-on-openshift
            # Every cluster carries its own backend, keyed by cluster name.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/apps/rhoai/values.yaml
              # The spoke's role (ai-grid/role): ingress, inference or combined.
              - '$values/apps/rhoai/roles/{{ index .metadata.labels "ai-grid/role" }}.yaml'
              - $deployment/{{ .values.deploymentPath }}/rhoai.yaml
              - $deployment/{{ .values.deploymentPath }}/clusters/{{ .name }}/rhoai.yaml
            parameters:
              - name: praxis-gateway.grid.siteName
                value: '{{ .name }}'
              # OSD ships these namespaces; a self-managed spoke has no creator.
              - name: operator.rhoai.olm.createNamespace
                value: '{{ ne .name "local-cluster" | toString }}'
              - name: dependencies.loki.olm.createNamespace
                value: '{{ ne .name "local-cluster" | toString }}'
              # RHOAIENG-99507 is the hub's conflict: ACM's observability add-on
              # installs COO there only. Other clusters need the chart's, or
              # OpenShift AI's monitoring stack and MaaS usage never come up.
              - name: dependencies.clusterObservability.enabled
                value: '{{ if eq .name "local-cluster" }}false{{ else }}auto{{ end }}'
        # The deployment's own objects for this cluster, such as declared
        # peers: <deployment>/clusters/<cluster>/manifests/, if it has any.
        - repoURL: '{{ .values.deploymentRepoURL }}'
          targetRevision: '{{ .values.deploymentRevision }}'
          path: '{{ .values.deploymentPath }}/clusters'
          directory:
            recurse: true
            include: '{{ .name }}/manifests/*.yaml'
        # The hub collects through ai-grid-o11y; a managed cluster's collector needs its own copies.
        - repoURL: https://github.com/ai-grid-cloud/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/ai-grid-o11y/spoke
          directory:
            exclude: '{{ if eq .name "local-cluster" }}*{{ end }}'
        - repoURL: https://github.com/ai-grid-cloud/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/grid-network
          helm:
            releaseName: grid-network
            # A site may declare the record only once it holds the enrolled
            # identity, so the file turning it on is the record of that.
            ignoreMissingValueFiles: true
            valueFiles:
              - $deployment/{{ .values.deploymentPath }}/clusters/{{ .name }}/grid-network.yaml
            parameters:
              - name: siteName
                value: '{{ .name }}'
        # The grid provider gateway is its own ApplicationSet,
        # 07-grid-provider-applicationset.yaml: inference and combined spokes.
        - repoURL: https://github.com/ai-grid-cloud/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/catalog
          helm:
            releaseName: rhoai-nightly-catalog
            valueFiles:
              - $values/apps/rhoai/nightly.yaml
      # The hub resolves to Argo's own in-cluster destination. Routing it back
      # through the cluster-proxy applies as the ACM addon ServiceAccount, which
      # the managed-cluster webhooks deny on redhat-* namespaces and on every
      # NetworkPolicy. Argo's controller ServiceAccount is allowed both.
      destination:
        server: '{{ if eq .name "local-cluster" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: redhat-ai-grid
      ignoreDifferences:
        # OpenShift injects a generated dockercfg pull secret into this
        # OLM-owned ServiceAccount. Ignore only that controller-generated entry
        # so Argo still owns the explicit catalog pull secret.
        - group: ""
          kind: ServiceAccount
          name: rhoai-catalog-dev
          namespace: openshift-marketplace
          jqPathExpressions:
            - '.imagePullSecrets[] | select(.name | startswith("rhoai-catalog-dev-dockercfg-"))'
        - group: ""
          kind: Secret
          name: grid-model-client-token
          namespace: redhat-ai-grid
          jsonPointers:
            - /data
            - /metadata/annotations
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          # Protected Namespaces are owned by ACM or the platform, and the
          # chart omits them through createNamespace=false.
          - CreateNamespace=false
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
