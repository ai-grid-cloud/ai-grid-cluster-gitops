apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  # The AITenant and MaaS tenant config go where MaaS runs: ingress and
  # combined spokes (apps/ai-grid-spokes).
  name: rhoai-tenant-clusters
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            - key: ai-grid/role
              operator: In
              values: [ingress, combined]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: rhoai-tenant
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "4"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: rhoai-tenant-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: rhoai-tenant
