# A combined spoke is ingress and inference at once: the values in
# apps/rhoai/values.yaml, plus the provider gateway and models.

# MaaS site settings stated here rather than left to the chart's maas profile.
components:
  kserve:
    dsc:
      # Running models have headed Services; the chart default would make them headless.
      rawDeploymentServiceConfig: Headed
dependencies:
  rhcl:
    config:
      spec:
        observability:
          enable: true
