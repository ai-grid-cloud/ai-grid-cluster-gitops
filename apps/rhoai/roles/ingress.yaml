profile: ai-grid-ingress

dependencies:
  rhcl:
    config:
      authorinoTrustedCA:
        configMaps:
          - odh-trusted-ca-bundle
          - openshift-service-ca.crt
          - home-keycloak-ca

# The chart creates the model-client token only where KServe runs, and an
# ingress site makes no local model dial; optional lets the gateway start.
praxis-gateway:
  providerCredentials:
    - secretName: grid-model-client-token
      optional: true
