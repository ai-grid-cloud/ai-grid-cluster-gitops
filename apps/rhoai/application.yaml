apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Dedicated GitOps app for the RHOAI ApplicationSet. It is discovered
  # automatically by the bootstrap ApplicationSet.
  name: rhoai
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@libraryRepoURL@'
    targetRevision: '@libraryRevision@'
    path: apps/rhoai/hub
    # The library's and the deployment's repositories and revisions, and the
    # tenant IdP (its inputs.yaml), from the root's values.
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: library-inputs
          patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: library-inputs
            data:
              libraryRepoURL: '@libraryRepoURL@'
              libraryRevision: '@libraryRevision@'
              deploymentRepoURL: '@deploymentRepoURL@'
              deploymentRevision: '@deploymentRevision@'
              idpIssuerURL: '@idpIssuerURL@'
              idpClientID: '@idpClientID@'
              idpClientSecretNamespace: '@idpClientSecretNamespace@'
              idpClientSecretName: '@idpClientSecretName@'
              idpClientSecretKey: '@idpClientSecretKey@'
              idpCANamespace: '@idpCANamespace@'
              idpCAName: '@idpCAName@'
              idpCAKey: '@idpCAKey@'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
