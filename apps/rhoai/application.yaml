apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Dedicated GitOps app for the RHOAI ApplicationSet. It is discovered
  # automatically by the bootstrap ApplicationSet.
  name: rhoai
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
    targetRevision: HEAD
    path: apps/rhoai/hub
    # The rhoai ApplicationSet reads per-cluster values from the deployment
    # repository. The root ApplicationSet fills in these tokens, and the
    # generator's values hand them to the template as .values.*.
    kustomize:
      patches:
        - target:
            group: argoproj.io
            kind: ApplicationSet
            name: rhoai
          patch: |-
            - op: add
              path: /spec/generators/0/matrix/generators/1/clusters/values
              value:
                deploymentRepoURL: '@deploymentRepoURL@'
                deploymentRevision: '@deploymentRevision@'
                deploymentPath: '@deploymentPath@'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
