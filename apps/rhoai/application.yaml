apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Dedicated GitOps app for the RHOAI ApplicationSet. It is discovered
  # automatically by the bootstrap ApplicationSet.
  name: rhoai
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-tenant.git
      targetRevision: HEAD
      path: apps/rhoai/hub
      # The nested ApplicationSets read cluster values from the deployment
      # repository. The root ApplicationSet fills these tokens in, and the
      # generator's values hand them to the template as .values.*.
      kustomize:
        patches:
          - target:
              group: argoproj.io
              kind: ApplicationSet
              name: rhoai
            patch: |-
              - op: add
                path: /spec/generators/0/matrix/generators/1/clusters/values
                value:
                  deploymentRepoURL: '@deploymentRepoURL@'
                  deploymentRevision: '@deploymentRevision@'
                  deploymentPath: '@deploymentPath@'
          # The provider gateways' ApplicationSet: the same values, and its git
          # generator reads which clusters have a gateway file from that repository.
          - target:
              group: argoproj.io
              kind: ApplicationSet
              name: grid-provider-gateway
            patch: |-
              - op: add
                path: /spec/generators/0/matrix/generators/0/matrix/generators/1/clusters/values
                value:
                  deploymentRepoURL: '@deploymentRepoURL@'
                  deploymentRevision: '@deploymentRevision@'
                  deploymentPath: '@deploymentPath@'
              - op: replace
                path: /spec/generators/0/matrix/generators/1/git/repoURL
                value: '@deploymentRepoURL@'
              - op: replace
                path: /spec/generators/0/matrix/generators/1/git/revision
                value: '@deploymentRevision@'
              - op: replace
                path: /spec/generators/0/matrix/generators/1/git/files/0/path
                value: '@deploymentPath@/clusters/{{ .name }}/provider-gateway.yaml'
    # The deployment's hub objects, such as the tenant OIDC client the tenant
    # Policy reads.
    - repoURL: '@deploymentRepoURL@'
      targetRevision: '@deploymentRevision@'
      path: '@deploymentPath@/hub'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
