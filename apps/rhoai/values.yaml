skipCrdCheck: true
profile: maas
operator:
  type: rhoai
  rhoai:
    olm:
      # Nightly catalog (image ref managed in apps/rhoai/nightly.yaml);
      # requires prerequisites distributed by apps/rhoai-prerequisites.
      source: rhoai-catalog-dev
      channel: stable-3.6
      # ACM owns this Red Hat managed Namespace; OSD rejects Argo writes to it.
      createNamespace: false
      config:
        env:
          # Temporary change to test maas-api loki proxy
          - name: RELATED_IMAGE_ODH_MAAS_API_IMAGE
            value: quay.io/khowell_dev/maas-api:loki-access-proxy
          # AI gateway controller at f36855d (ai-gateway-controller#209: the maas-api routes
          # bypass ext_proc, so MaaS API calls stop failing); until the RHOAI 3.6 payload carries it.
          - name: RELATED_IMAGE_ODH_AI_GATEWAY_CONTROLLER_IMAGE
            value: quay.io/sbatsche/odh-ai-gateway-controller@sha256:3968ba3bf7037ae2eba0c6b9239c4b72ba50ef193fed987caf89649e49467015
# Workaround for https://redhat.atlassian.net/browse/RHOAIENG-99507:
# RHACM's multicluster-observability-addon also installs COO with its own
# OperatorGroup (named after the namespace), which conflicts with the chart's
# (named after the package) and blocks CSV installs/upgrades. Let RHACM own
# COO on this cluster until the OG naming is standardized in odh-gitops.
dependencies:
  rhcl:
    olm:
      config:
        env:
          - name: AUTH_SERVICE_TIMEOUT
            value: 1s
  clusterObservability:
    enabled: false
  loki:
    olm:
      # The platform owns this Red Hat managed Namespace.
      createNamespace: false
services:
  monitoring:
    dsci:
      managementState: Managed
      # Minimal dev config: metrics need storage size; traces require a
      # storage backend (pv = ephemeral-ish local dev storage, no S3 needed).
      # ACM reads the collector's own prometheus exporter, so no extra exporter here.
      metrics:
        storage:
          size: 20Gi
      traces:
        storage:
          backend: pv
          size: 10Gi
components:
  dashboard:
    dsc:
      # Declare both children; these profiles otherwise leave standard Removed.
      standard:
        managementState: Managed
      maasPortal:
        managementState: Managed
  kserve:
    gateway:
      annotations:
        grid.opendatahub.io/serving: >-
          {
            "networkName": "grid",
            "namespace": "redhat-ai-grid",
            "serviceAccount": "grid-model-client",
            "tokenSecret": "grid-model-client-token",
            "publishMetrics": true
          }
      spec:
        # A platform-issued serving cert on the https listener, as RHOAI's own
        # gateway has: the grid gateway dials this gateway for every local model.
        infrastructure:
          annotations:
            service.beta.openshift.io/serving-cert-secret-name: openshift-ai-inference-service-tls
            # Envoy statistics Istio's default matcher drops (ext_proc, ext_authz, downstream and upstream counters, wasm).
            proxy.istio.io/config: |
                  proxyStatsMatcher:
                    inclusionRegexps:
                      - ".*ext_proc.*"
                      - ".*ext_authz.*"
                      - ".*ratelimit.*"
                      - ".*wasm.*"
                      - "http\\..*\\.downstream_rq_.*"
                      - "http\\..*\\.downstream_cx_.*"
                      - "listener\\..*\\.downstream_cx_.*"
                      - "cluster\\..*\\.upstream_(rq|cx)_.*"
                      - "server\\..*"
                      - "overload\\..*"
                      - "cluster\\..*\\.outlier_detection\\..*"
        listeners:
          - name: http
            port: 80
            # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
            protocol: HTTP
            allowedRoutes:
              namespaces:
                # AI project namespaces opt in with grid.opendatahub.io/allowed=true.
                from: Selector
                selector:
                  matchLabels:
                    grid.opendatahub.io/allowed: "true"

          - name: https
            port: 443
            # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
            protocol: HTTPS
            tls:
              mode: Terminate
              certificateRefs:
                - name: openshift-ai-inference-service-tls
            allowedRoutes:
              namespaces:
                # AI project namespaces opt in with grid.opendatahub.io/allowed=true.
                from: Selector
                selector:
                  matchLabels:
                    grid.opendatahub.io/allowed: "true"
  aigateway:
    dsc:
      aiGrid:
        managementState: Managed
    modelsAsAService:
      gateway:
        spec:
          infrastructure:
            annotations:
              # Same Envoy statistics for the MaaS gateway (Kuadrant wasm shim and Limitador included).
              proxy.istio.io/config: |
                    proxyStatsMatcher:
                      inclusionRegexps:
                        - ".*ext_proc.*"
                        - ".*ext_authz.*"
                        - ".*ratelimit.*"
                        - ".*wasm.*"
                        - "http\\..*\\.downstream_rq_.*"
                        - "http\\..*\\.downstream_cx_.*"
                        - "listener\\..*\\.downstream_cx_.*"
                        - "cluster\\..*\\.upstream_(rq|cx)_.*"
                        - "server\\..*"
                        - "overload\\..*"
                        - "cluster\\..*\\.outlier_detection\\..*"
          listeners:
            - name: http
              port: 80
              # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  # The following is an example of how to restrict the namespaces to the interested ones.
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          # MaaS models in a Grid are represented by ExternalModel resources pointing to the Grid GW.
                          - models-as-a-service
                          - redhat-ai-gateway-infra
          # No https listener until it has a certificate: maas-api advertises
          # the https listener first, and without a certificate 443 is never bound.

# The payload's Grid runtimes. Argo renders these charts, not the operator, so they
# name the images the operator's payload ships. Keep them aligned when the catalog moves:
#   oc -n redhat-ods-operator get deploy rhods-operator -o json | jq -r '
#     .spec.template.spec.containers[].env[] | select(.name|test("PRAXIS_AI_GRID"))'
global:
  relatedImages:
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_GATEWAY_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:e2ae6ac64b675ec29a4d9a3728f9c9b19063ef21b59dce26542283034592c150
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_ENROLLMENT_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9@sha256:e211b13d0ad66915d270ff6f8b54b20d5e6882cd349b7b266aec66282be55cda
    # The bundle publishes this one as RELATED_IMAGE_POSTGRESQL_16_IMAGE.
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_POSTGRES_IMAGE
      value: registry.redhat.io/rhel9/postgresql-16@sha256:435ba5c1d3f686cf8a45ae525b4d169ced6b33753bcfab99a1498bd9e6e99817

# Enrollment comes from grid-bootstrap on the hub, through ACM. The vendored
# chart enables its own enrollment service unless this says otherwise.
grid-enrollment:
  enabled: false

# The enrollment policy delivers GridNetwork; the operator publishes its local
# GridSite from its identity. flavor is explicit because the chart only infers
# grid-gateway from a repository name ending in /grid-gateway, which the RHOAI
# image does not.
praxis-gateway:
  metricsListener:
    fromNamespaces:
      - redhat-ods-monitoring
      - openshift-user-workload-monitoring
    serviceMonitor:
      labels:
        monitoring.opendatahub.io/scrape: "true"
  enabled: true
  image:
    flavor: grid-gateway
    # Keep aligned with global.relatedImages above and apps/rhoai/provider-gateway.yaml.
    repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9
    digest: sha256:e2ae6ac64b675ec29a4d9a3728f9c9b19063ef21b59dce26542283034592c150
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2
      memory: 1Gi
  # Only MaaS and the router reach the consumer gateway; it dials peers with this site's identity.
  networkPolicy:
    enabled: true
    from:
      - podSelector:
          matchLabels:
            grid.opendatahub.io/gateway-client: "true"
      - namespaceSelector:
          matchLabels:
            network.openshift.io/policy-group: ingress
  grid:
    networkName: grid
    # siteName comes from the ApplicationSet, one per cluster.
  praxisConfig:
    source: render
    render:
      # MaaS authenticates the caller.
      auth:
        mode: none
      # No backends: the gateway dials what the operator derives from the
      # InferenceProviders and GridSites of this site, through the serving
      # ConfigMap's dial file. Local models are reached through the RHOAI
      # serving gateway, so the EPP picks the pod.
      gridServing:
        enabled: true
        networkName: grid
        # Explicit: the default follows fullnameOverride.
        gatewayRefName: grid-gateway
  gridIdentity:
    tlsSecretName: grid-site-identity
    caSecretName: grid-ca
    mountPath: /etc/praxis/tls
  listenerTls:
    secretName: grid-gateway-listener-tls
  # The model-client token a local dial sends to the serving gateway.
  providerCredentials:
    - secretName: grid-model-client-token
  # The service CA (rhoai-prerequisites copies it into this Secret) verifies the
  # serving gateway's cert on a local dial; remote hops carry the grid CA.
  upstreamCA:
    secretName: openshift-service-ca
    key: ca.crt
  port:
    containerPort: 8443
  service:
    enabled: true
    type: ClusterIP
    # What inference.opendatahub.io/port already names.
    port: 443
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: grid-gateway-listener-tls
