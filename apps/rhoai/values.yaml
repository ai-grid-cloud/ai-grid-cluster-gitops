skipCrdCheck: true
operator:
  type: rhoai
  rhoai:
    olm:
      # Nightly catalog (image ref managed in apps/rhoai/nightly.yaml);
      # requires prerequisites distributed by apps/rhoai-prerequisites.
      source: rhoai-catalog-dev
      channel: stable-3.6
      # ACM owns this Red Hat managed Namespace; OSD rejects Argo writes to it.
      createNamespace: false

dependencies:
  opentelemetry:
    olm:
      # Keep aligned with the cert-manager compatibility grant in apps/rhoai-prerequisites/hub/12-otel-cert-manager-policy.yaml.
      namespace: openshift-opentelemetry-operator

# Metrics enrolment from cluster-gitops #169 (carried), ported onto the
# profile layout: Envoy statistics Istio's default matcher drops, and the grid
# gateways' TLS metrics listeners in RHOAI's collector.
components:
  kserve:
    gateway:
      spec:
        infrastructure:
          annotations:
            proxy.istio.io/config: |
              proxyStatsMatcher:
                inclusionRegexps:
                  - ".*ext_proc.*"
                  - ".*ext_authz.*"
                  - ".*ratelimit.*"
                  - ".*wasm.*"
                  - "http\\..*\\.downstream_rq_.*"
                  - "http\\..*\\.downstream_cx_.*"
                  - "listener\\..*\\.downstream_cx_.*"
                  - "cluster\\..*\\.upstream_(rq|cx)_.*"
                  - "server\\..*"
                  - "overload\\..*"
                  - "cluster\\..*\\.outlier_detection\\..*"
  aigateway:
    modelsAsAService:
      gateway:
        # main (3f0b6cc): apps/rhoai/gateway-hostname reads these.
        name: maas-default-gateway
        namespace: openshift-ingress
        annotations:
          ai-grid/maas-gateway-hostname-prefix: maas
        spec:
          infrastructure:
            annotations:
              proxy.istio.io/config: |
                proxyStatsMatcher:
                  inclusionRegexps:
                    - ".*ext_proc.*"
                    - ".*ext_authz.*"
                    - ".*ratelimit.*"
                    - ".*wasm.*"
                    - "http\\..*\\.downstream_rq_.*"
                    - "http\\..*\\.downstream_cx_.*"
                    - "listener\\..*\\.downstream_cx_.*"
                    - "cluster\\..*\\.upstream_(rq|cx)_.*"
                    - "server\\..*"
                    - "overload\\..*"
                    - "cluster\\..*\\.outlier_detection\\..*"
praxis-gateway:
  metricsListener:
    fromNamespaces:
      - redhat-ods-monitoring
      - openshift-user-workload-monitoring
    serviceMonitor:
      labels:
        monitoring.opendatahub.io/scrape: "true"
praxis-provider-gateway:
  metricsListener:
    fromNamespaces:
      - redhat-ods-monitoring
      - openshift-user-workload-monitoring
    serviceMonitor:
      labels:
        monitoring.opendatahub.io/scrape: "true"

# The payload's Grid runtimes. Argo renders these charts, not the operator, so
# they name the images the operator's payload ships.
global:
  relatedImages:
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_GATEWAY_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:fa06fe6911c549583c8870c8ac5cae094108c40889357e273f313888b71d6633
