skipCrdCheck: true
operator:
  type: rhoai
  rhoai:
    olm:
      # Nightly catalog (image ref managed in apps/rhoai/nightly.yaml);
      # requires prerequisites distributed by apps/rhoai-prerequisites.
      source: rhoai-catalog-dev
      channel: stable-3.6
      # ACM owns this Red Hat managed Namespace; OSD rejects Argo writes to it.
      createNamespace: false
      config:
        env:
          # Temporary change to test maas-api loki proxy
          - name: RELATED_IMAGE_ODH_MAAS_API_IMAGE
            value: quay.io/khowell_dev/maas-api:loki-access-proxy
          # AI gateway controller at f36855d (ai-gateway-controller#209: the maas-api routes
          # bypass ext_proc, so MaaS API calls stop failing); until the RHOAI 3.6 payload carries it.
          - name: RELATED_IMAGE_ODH_AI_GATEWAY_CONTROLLER_IMAGE
            value: quay.io/sbatsche/odh-ai-gateway-controller@sha256:3968ba3bf7037ae2eba0c6b9239c4b72ba50ef193fed987caf89649e49467015

# The payload's Grid runtimes. Argo renders these charts, not the operator, so
# they name the images the operator's payload ships.
global:
  relatedImages:
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_GATEWAY_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:e2ae6ac64b675ec29a4d9a3728f9c9b19063ef21b59dce26542283034592c150
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_ENROLLMENT_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9@sha256:e211b13d0ad66915d270ff6f8b54b20d5e6882cd349b7b266aec66282be55cda
    # The bundle publishes this one as RELATED_IMAGE_POSTGRESQL_16_IMAGE.
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_POSTGRES_IMAGE
      value: registry.redhat.io/rhel9/postgresql-16@sha256:435ba5c1d3f686cf8a45ae525b4d169ced6b33753bcfab99a1498bd9e6e99817
