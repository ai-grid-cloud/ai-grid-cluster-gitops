# S4's S3 keys and the Thanos configuration that uses them, in one Secret:
# thanos-object-storage, the object-storage contract
# (apps/object-storage/README.md). external-secrets generates both keys once
# (refreshPolicy CreatedOnce) and keeps the Secret if this ExternalSecret goes
# (deletionPolicy Retain): S4 creates its user from the keys on first start,
# so they must not change. No key is ever in git.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: s4-access-key
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 20
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: s4-secret-key
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-object-storage
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 0s
  target:
    name: thanos-object-storage
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # Keep the generated keys beside thanos.yaml: S4 and the bucket Job
      # read them from this Secret.
      mergePolicy: Merge
      data:
        thanos.yaml: |
          type: s3
          config:
            bucket: thanos
            endpoint: s4.open-cluster-management-observability.svc:7480
            insecure: true
            access_key: "{{ .AWS_ACCESS_KEY_ID }}"
            secret_key: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: s4-access-key
      rewrite:
        - regexp:
            source: ^password$
            target: AWS_ACCESS_KEY_ID
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: s4-secret-key
      rewrite:
        - regexp:
            source: ^password$
            target: AWS_SECRET_ACCESS_KEY
