apiVersion: batch/v1
kind: Job
metadata:
  name: mco-thanos-bridge
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: mco-thanos-bridge
      restartPolicy: Never
      containers:
        - name: bridge
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              NAMESPACE="open-cluster-management-observability"
              OBC_NAME="acm-observability-thanos"
              SECRET_NAME="thanos-object-storage"

              echo "Waiting for ObjectBucketClaim ${OBC_NAME} to reach phase Bound (timeout 900s)"
              oc wait --for=jsonpath='{.status.phase}'=Bound "objectbucketclaim/${OBC_NAME}" -n "${NAMESPACE}" --timeout=900s

              # Read a key from the OBC-generated Secret; fails loudly if the
              # Secret or the key is missing. Never echoes the value.
              read_secret_key() {
                local key="$1" raw
                if ! raw="$(oc get secret "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath="{.data.${key}}")"; then
                  echo "ERROR: cannot read Secret ${OBC_NAME} in namespace ${NAMESPACE}" >&2
                  exit 1
                fi
                if [ -z "${raw}" ]; then
                  echo "ERROR: key ${key} is missing from Secret ${OBC_NAME} in namespace ${NAMESPACE}" >&2
                  exit 1
                fi
                printf '%s' "${raw}" | base64 -d
              }

              # Read a key from the OBC-generated ConfigMap; fails loudly if the
              # ConfigMap or the key is missing.
              read_configmap_key() {
                local key="$1" raw
                if ! raw="$(oc get configmap "${OBC_NAME}" -n "${NAMESPACE}" -o jsonpath="{.data.${key}}")"; then
                  echo "ERROR: cannot read ConfigMap ${OBC_NAME} in namespace ${NAMESPACE}" >&2
                  exit 1
                fi
                if [ -z "${raw}" ]; then
                  echo "ERROR: key ${key} is missing from ConfigMap ${OBC_NAME} in namespace ${NAMESPACE}" >&2
                  exit 1
                fi
                printf '%s' "${raw}"
              }

              AWS_ACCESS_KEY_ID="$(read_secret_key AWS_ACCESS_KEY_ID)"
              AWS_SECRET_ACCESS_KEY="$(read_secret_key AWS_SECRET_ACCESS_KEY)"
              BUCKET_HOST="$(read_configmap_key BUCKET_HOST)"
              BUCKET_PORT="$(read_configmap_key BUCKET_PORT)"
              BUCKET_NAME="$(read_configmap_key BUCKET_NAME)"

              ENDPOINT="${BUCKET_HOST}:${BUCKET_PORT}"

              # Render thanos.yaml to a temp file. Its contents are never printed.
              THANOS_YAML="$(mktemp)"
              trap 'rm -f "${THANOS_YAML}"' EXIT
              {
                echo "type: s3"
                echo "config:"
                echo "  bucket: ${BUCKET_NAME}"
                echo "  endpoint: ${ENDPOINT}"
                echo "  insecure: false"
                echo "  access_key: ${AWS_ACCESS_KEY_ID}"
                echo "  secret_key: ${AWS_SECRET_ACCESS_KEY}"
                echo "  http_config:"
                echo "    tls_config:"
                echo "      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
              } > "${THANOS_YAML}"

              # Create-or-replace the Thanos object-storage Secret.
              oc create secret generic "${SECRET_NAME}" \
                --from-file=thanos.yaml="${THANOS_YAML}" \
                -n "${NAMESPACE}" \
                --dry-run=client \
                -o yaml | oc apply -f -

              echo "Secret ${SECRET_NAME} rendered in namespace ${NAMESPACE} for bucket ${BUCKET_NAME} at endpoint ${ENDPOINT}"
