# The odh-gitops CRD carry marked the Grid CRDs opendatahub.io/managed=false, so the
# platform skipped them. With the carry gone the platform owns them again; this
# merges only that annotation, and never deletes a CRD.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-crd-handback
  namespace: redhat-ai-grid
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-crd-handback
  namespace: redhat-ai-grid
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-crd-handback
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: grid-crd-handback
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-crd-handback
  namespace: redhat-ai-grid
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: grid-crd-handback
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                metadata:
                  name: agenttoolproviders.grid.praxis.fast
                  annotations:
                    opendatahub.io/managed: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                metadata:
                  name: gridnetworks.grid.praxis.fast
                  annotations:
                    opendatahub.io/managed: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                metadata:
                  name: gridsites.grid.praxis.fast
                  annotations:
                    opendatahub.io/managed: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                metadata:
                  name: inferenceproviders.grid.praxis.fast
                  annotations:
                    opendatahub.io/managed: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                metadata:
                  name: siteinvites.grid.praxis.fast
                  annotations:
                    opendatahub.io/managed: "true"
