mode: external
fullnameOverride: grid-bootstrap
# Grid v0.3.0-rc.3 enrollment from the release on ghcr, matching apps/rhoai/values.yaml,
# until RHDS ships rc.3.
image:
  repository: ghcr.io/praxis-proxy/grid-enrollment
  digest: sha256:cdb9c6f5d9ccca8f87920a19db6ba3b38faea3f0dc4153bacd3e34a00c0ab749
gridIdentity:
  enabled: true
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: false
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # Preserve the existing CA while external issuance takes over identities.
      mode: Existing
      secretName: grid-ca-key
