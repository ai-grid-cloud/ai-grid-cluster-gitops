mode: external
fullnameOverride: grid-bootstrap
# The payload's enrollment image, matching apps/rhoai/values.yaml.
image:
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9
  digest: sha256:f61ed291932dc8cca9b64bf637b9590068d816658bbf73ef2098246ac6968cb6
gridIdentity:
  enabled: true
ca:
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # This release owns the global binding in redhat-ai-grid, which the grid's
  # invite Placements select through: bootstrap/hub removes the rhoai app's
  # copy. Upstream's combined lab root keeps rhoai's copy and sets false
  # (values/grid-bootstrap.yaml).
  createClusterSetBinding: true
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    # ca.mode (Generate for a new grid, Existing to keep its CA) and, for
    # Existing, ca.secretName are the deployment's: values/grid-bootstrap.yaml.
