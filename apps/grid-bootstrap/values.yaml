mode: external
fullnameOverride: grid-bootstrap
# The payload's enrollment image, matching apps/rhoai/values.yaml.
image:
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9
  digest: sha256:8a4843da03106c15d241088a62e52559da1139e58e8852e1b4703c625f5eb2be
gridIdentity:
  enabled: true
ca:
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: false
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # Preserve the existing CA while external issuance takes over identities.
      mode: Existing
      secretName: grid-ca-key
