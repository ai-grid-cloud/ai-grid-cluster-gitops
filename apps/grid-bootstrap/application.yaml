apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-bootstrap
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: '@libraryRepoURL@'
      targetRevision: '@libraryRevision@'
      ref: values
    # The deployment's grid values: at least external.certManager.ca.mode
    # (Generate for a new grid, Existing to keep its CA). Required.
    - repoURL: '@deploymentRepoURL@'
      targetRevision: '@deploymentRevision@'
      ref: deployment
    - repoURL: https://github.com/opendatahub-io/odh-gitops.git
      targetRevision: main
      path: charts/rhai-on-openshift-chart/charts/grid-enrollment
      helm:
        releaseName: grid-bootstrap
        valueFiles:
          - $values/apps/grid-bootstrap/values.yaml
          - $deployment/values/grid-bootstrap.yaml
    - repoURL: '@libraryRepoURL@'
      targetRevision: '@libraryRevision@'
      path: apps/grid-bootstrap/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ai-grid
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
