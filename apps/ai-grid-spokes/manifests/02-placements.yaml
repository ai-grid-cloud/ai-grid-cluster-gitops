# AI Grid sites are ManagedClusters labelled ai-grid/enabled=true with an
# ai-grid/role, which picks what the platform installs there. Without a known
# role nothing is installed, although grid-bootstrap reads ai-grid/enabled alone:
#   ingress    MaaS, the portal and the grid consumer gateway; no models
#   inference  models and the grid provider gateway; no MaaS
#   combined   both
#
# ApplicationSets read these Placements' decisions live
# (clusterDecisionResource), never the labels on Argo CD's cluster Secret alone:
# ACM adds and updates those labels but never removes one, so a cluster whose
# ai-grid/enabled label is removed would keep its apps. Tolerations keep a
# briefly unreachable site selected, so a network blip removes nothing.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: ai-grid-spokes
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            - key: ai-grid/role
              operator: In
              values: [ingress, inference, combined]
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: cluster.open-cluster-management.io/v1beta1
