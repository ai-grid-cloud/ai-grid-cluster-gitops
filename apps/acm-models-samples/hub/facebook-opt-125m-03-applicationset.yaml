apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Generates one Application for every AI Grid site where models run.
  name: acm-models-facebook-opt-125m
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Moved here from apps/acm-models: on an existing install that Application's prune
    # must not delete this before this one adopts it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Sites where models run: role inference or combined (apps/ai-grid-spokes).
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-inference
              requeueAfterSeconds: 60
          - clusters:
              # The cluster's Argo CD Secret, for its labels: a hub that is also a site syncs
              # through the in-cluster API, not the ACM cluster proxy.
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'acm-models-facebook-opt-125m-{{.name}}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: REQUIRED-libraryRepoURL
        targetRevision: REQUIRED-libraryRevision
        path: apps/acm-models-samples/facebook-opt-125m
      destination:
        server: '{{ if eq (index .metadata.labels "local-cluster") "true" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: models-as-a-service
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
