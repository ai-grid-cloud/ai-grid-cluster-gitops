# The library's sample models and their MaaS objects, with the lab's sample
# subscriptions: a component a deployment selects only for a demo. A
# kustomization so apps/acm-models-samples/application.yaml can hand the
# ApplicationSets the library's repository and revision (inputs.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - inputs.yaml
  - facebook-opt-125m-03-applicationset.yaml
  - maas-03-applicationset.yaml
  - smollm2-135m-instruct-01-placement.yaml
  - smollm2-135m-instruct-03-applicationset.yaml
replacements:
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRepoURL
    targets:
      - select:
          kind: ApplicationSet
          name: acm-models-facebook-opt-125m
        fieldPaths:
          - spec.template.spec.source.repoURL
      - select:
          kind: ApplicationSet
          name: acm-models-maas
        fieldPaths:
          - spec.template.spec.source.repoURL
      - select:
          kind: ApplicationSet
          name: acm-models-smollm2-135m-instruct
        fieldPaths:
          - spec.template.spec.source.repoURL
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRevision
    targets:
      - select:
          kind: ApplicationSet
          name: acm-models-facebook-opt-125m
        fieldPaths:
          - spec.template.spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: acm-models-maas
        fieldPaths:
          - spec.template.spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: acm-models-smollm2-135m-instruct
        fieldPaths:
          - spec.template.spec.source.targetRevision
