apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: facebook-opt-125m
  # Namespace is fixed since it needs to be allowed in the Gateway allowed routes and the namespace itself
  # has to have configurations to allow Grid binding.
  namespace: ai-grid-internal-models
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  baseRefs:
    - name: v3-6-0-kserve-config-llm-template-cpu
  model:
    uri: hf://facebook/opt-125m
    # Name needs to match ExternalModel target model name
    name: facebook-opt-125m
  replicas: 3
  router:
    scheduler:
      template:
        containers:
          - name: main
            args:
              - --metrics-cert-dir=/var/run/kserve/tls
    route: { }
    gateway:
      refs:
        - name: openshift-ai-inference
          namespace: openshift-ingress
  template:
    # The 3.6 base preset adds pvc-evictor, which exits without /kv-cache.
    volumes:
      - name: kv-cache
        emptyDir: {}
    containers:
      - name: pvc-evictor
        volumeMounts:
          - name: kv-cache
            mountPath: /kv-cache
          - name: kv-cache
            mountPath: /kv-cache/kv/model-cache/models
            subPath: models
      - name: main
        # opt-125m is a base model without a chat template, so vLLM refuses /v1/chat/completions
        # (HTTP 400). vLLM loads a bare template name from the chat templates it bundles; ChatML is
        # its own example. A name needs no shell quoting in the preset's launcher, which evals its
        # args, and no ConfigMap.
        # It rarely ends a reply, so vLLM caps replies at 64 tokens; the dotted form needs no JSON quotes.
        args:
          - --chat-template=template_chatml.jinja
          - --override-generation-config.max_new_tokens=64
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
        resources:
          limits:
            cpu: '1'
            memory: 10Gi
          requests:
            cpu: '100m'
            memory: 8Gi
