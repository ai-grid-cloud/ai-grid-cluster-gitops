apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Only a dedicated hub syncs this. On a hub that is also a site, MaaS's shared
  # state runs on the hub through the keycloak, limitador-redis, external-secrets
  # and maas-db apps, so the default root ApplicationSet excludes it.
  name: external-services
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@libraryRepoURL@'
    targetRevision: '@libraryRevision@'
    path: apps/external-services/hub
    # The library's own repository and revision for the ApplicationSets in
    # this directory (its inputs.yaml), from the root's values.
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: library-inputs
          patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: library-inputs
            data:
              libraryRepoURL: '@libraryRepoURL@'
              libraryRevision: '@libraryRevision@'
  # maas-db, created untracked, holds the rhoai app's tenant RBAC Role; this
  # app's own objects name the external-services namespace.
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
