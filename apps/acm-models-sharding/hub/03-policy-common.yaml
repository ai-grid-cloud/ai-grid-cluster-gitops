apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: acm-models-sharding-common
  namespace: acm-models-sharding
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: acm-models-sharding-catalog
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: DeleteAll
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: inference.opendatahub.io/v1alpha1
                kind: ExternalModel
                metadata:
                  name: smollm2-135m-instruct
                  namespace: models-as-a-service
                spec:
                  externalProviderRefs:
                    - apiFormat: openai-chat
                      path: /v1/chat/completions
                      ref:
                        name: grid-provider
                      targetModel: HuggingFaceTB/SmolLM2-135M-Instruct
                      weight: 1
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaaSModelRef
                metadata:
                  name: smollm2-135m-instruct
                  namespace: models-as-a-service
                spec:
                  modelRef:
                    kind: ExternalModel
                    name: smollm2-135m-instruct
            - complianceType: musthave
              objectDefinition:
                apiVersion: inference.opendatahub.io/v1alpha1
                kind: ExternalModel
                metadata:
                  name: smollm2-360m-instruct
                  namespace: models-as-a-service
                spec:
                  externalProviderRefs:
                    - apiFormat: openai-chat
                      path: /v1/chat/completions
                      ref:
                        name: grid-provider
                      targetModel: HuggingFaceTB/SmolLM2-360M-Instruct
                      weight: 1
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaaSModelRef
                metadata:
                  name: smollm2-360m-instruct
                  namespace: models-as-a-service
                spec:
                  modelRef:
                    kind: ExternalModel
                    name: smollm2-360m-instruct
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: acm-models-sharding-maas
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: DeleteAll
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaaSSubscription
                metadata:
                  name: acm-models-sharding-users
                  namespace: models-as-a-service
                spec:
                  organization:
                    id: 42c3e46f-2477-44d7-a85b-d3b43f6b31fa
                  modelRefs:
                    - name: smollm2-135m-instruct
                      namespace: models-as-a-service
                      tokenRateLimits:
                        - limit: 1000
                          window: 1m
                    - name: smollm2-360m-instruct
                      namespace: models-as-a-service
                      tokenRateLimits:
                        - limit: 1000
                          window: 1m
                  owner:
                    groups:
                      - name: 42c3e46f-2477-44d7-a85b-d3b43f6b31fa/ai-grid-users
                  priority: 0
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaaSAuthPolicy
                metadata:
                  name: acm-models-sharding-users-policy
                  namespace: models-as-a-service
                spec:
                  modelRefs:
                    - name: smollm2-135m-instruct
                      namespace: models-as-a-service
                    - name: smollm2-360m-instruct
                      namespace: models-as-a-service
                  subjects:
                    groups:
                      - name: 42c3e46f-2477-44d7-a85b-d3b43f6b31fa/ai-grid-admins
                      - name: 42c3e46f-2477-44d7-a85b-d3b43f6b31fa/ai-grid-users
