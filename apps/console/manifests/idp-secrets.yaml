# Tenant IdP client secrets (backend #64): the backend reads, by name, the
# Secret an organization's identity provider names (key client-secret) from
# this namespace when it creates the provider in Keycloak. get only: it never
# lists, watches or writes Secrets. An admin creates each Secret out of band.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-grid-idp-secrets
  labels:
    app.kubernetes.io/part-of: ai-grid-provider-console
    app.kubernetes.io/component: idp-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-grid-provider-backend-idp-secrets
  namespace: ai-grid-idp-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-grid-provider-backend-idp-secrets
  namespace: ai-grid-idp-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-grid-provider-backend-idp-secrets
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-console
    namespace: ai-grid-provider-console
