apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The cloud provider's admin console on the hub, from its own Helm chart:
  # one pod with kube-auth-proxy (OpenShift sign-in), the console and its
  # backend. It saves models and subscriptions as commits to the catalog
  # repository that apps/acm-models delivers. Before the first sync, run
  # create-secrets.sh (README.md).
  name: console
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-provider-console.git
      # A commit, not a branch: the chart holds ClusterRoleBindings and a
      # ValidatingAdmissionPolicy that Argo CD applies with cluster-admin
      # rights, so what runs here changes only by a reviewed commit. Bump it
      # with the images.
      targetRevision: 0c0889900ff5e591a221efeaa5e955e31905bba5
      path: charts/ai-grid-provider-console
      helm:
        releaseName: ai-grid-provider-console
        valuesObject:
          # By digest: tags can be overwritten. Console and chart are main
          # 0c08899 (console #189); the backend is main 1b0b266 (backend #90),
          # which writes the broker settings the saas realm (apps/keycloak)
          # expects. The console is generated from backend cd03b7f; the backend
          # since then only adds optional fields, limits a new subscription's
          # name to 49 characters and requires an organization domain, as this
          # console does. Move them together.
          images:
            console:
              tag: sha-0c0889900ff5e591a221efeaa5e955e31905bba5
              digest: sha256:b09408c08ddac41454a019a9675445ed0f8df63fbbfe8aa7928bb2dfe74de4d1
            backend:
              tag: sha-1b0b266f8bc97a26cba4384e9d13bab48e1f58dd
              digest: sha256:9c6e9acf8c3db9e42606bbfe7493d136ca696023655034d9ee7e1e54edde144c
            authProxy:
              tag: ""
              digest: sha256:1a5f6e220362aa2077026bb7e3091c38f80aac861fa060b08045e58e783d5bc5
          console:
            # The Monitoring page: its tabs are the dashboard-* PersesDashboards in
            # one project, here OpenShift AI's, served by the Cluster Observability
            # Operator's Perses on the hub.
            perses:
              url: https://perses.openshift-cluster-observability-operator.svc:8080
              project: redhat-ods-monitoring
          backend:
            # Add to AI Grid and Remove patch ManagedCluster labels. The chart's
            # ValidatingAdmissionPolicy limits the backend to the ai-grid/* and
            # location labels and the ai-grid/* annotations.
            clusterWrites: true
            # The catalog repository. The token that pushes to it is Secret
            # ai-grid-backend-git, never in git; keep it scoped to this
            # repository alone.
            git:
              url: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
              branch: main
              # Where the backend writes models. The catalog's delivery, its
              # AppProject and its status Policy all assume this namespace,
              # which rhoai-prerequisites' Policy creates.
              modelsNamespace: ai-grid-internal-models
    # What the chart doesn't hold: ACM Search access for the backend.
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
      targetRevision: HEAD
      path: apps/console/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-grid-provider-console
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
