apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The cloud provider's admin console on the hub, from its own Helm chart:
  # one pod with kube-auth-proxy (OpenShift sign-in), the console and its
  # backend. It saves models and subscriptions as commits to the catalog
  # repository that apps/acm-models delivers. Before the first sync, run
  # create-secrets.sh (README.md).
  name: console
  namespace: openshift-gitops
spec:
  project: default
  sources:
    # ACM dashboards on Monitoring (11-03): console PR #128's head on
    # cfchase's fork, which holds that commit. Back to ai-grid-cloud's main
    # once #128 merges.
    - repoURL: https://github.com/cfchase/ai-grid-provider-console.git
      # A commit, not a branch: the chart holds ClusterRoleBindings and a
      # ValidatingAdmissionPolicy that Argo CD applies with cluster-admin
      # rights, so what runs here changes only by a reviewed commit. Bump it
      # with the images.
      targetRevision: 4d53d173a856c18fc5f7291a00d760fc1a72cd47
      path: charts/ai-grid-provider-console
      helm:
        releaseName: ai-grid-provider-console
        valuesObject:
          # By digest: tags can be overwritten. Console and chart are PR #128
          # (4d53d17, on main 5f0cdb2), built in the hub's registry; the backend
          # is 064ebd3, the console's .backend-api-version. Move them together:
          # this console sends what only that backend accepts. Back to main's
          # sha-<commit> once #128 merges.
          images:
            console:
              repository: image-registry.openshift-image-registry.svc:5000/ai-grid-provider-console/ai-grid-provider-console-acm
              tag: pr128-4d53d17
              digest: sha256:c99f6c258c77e7ac90b9851d63d0cb17139c8482fd2fadaa855e43ab83f24f12
            # SSO (P1, ai-grid-research, 11-04): RJ's backend #64 head bf15ceb,
            # built in the hub's registry. Back to main's sha-<commit> once #64
            # merges.
            backend:
              repository: image-registry.openshift-image-registry.svc:5000/ai-grid-provider-console/ai-grid-provider-backend-sso
              tag: pr64-bf15ceb
              digest: sha256:8979de9d5318769a7d0cccf74004bae2ff3b32f8a7ab0d874855c692ec40b1dc
            authProxy:
              tag: ""
              digest: sha256:1a5f6e220362aa2077026bb7e3091c38f80aac861fa060b08045e58e783d5bc5
          console:
            # The Monitoring page: its tabs are the dashboard-* PersesDashboards in
            # one project, here OpenShift AI's, served by the Cluster Observability
            # Operator's Perses on the hub.
            perses:
              url: https://perses.openshift-cluster-observability-operator.svc:8080
              project: redhat-ods-monitoring
              # Four of ACM observability's dashboards as more tabs. The relay
              # passes only these names. On this hub only cluster admins and
              # platform controllers can write PersesDashboards and
              # PersesDatasources in that namespace (checked 11-03).
              extraDashboards:
                - project: open-cluster-management-observability
                  dashboards:
                    - name: acm-clusters-overview
                      title: Clusters overview
                    - name: acm-cluster-rsrc-use
                      title: Cluster resource use
                    - name: acm-optimization-overview
                      title: Cluster optimization
                    - name: acm-alerts-by-cluster
                      title: Alerts by cluster
                  datasources:
                    - rbac-query-proxy-datasource
          backend:
            # Add to AI Grid and Remove patch ManagedCluster labels. The chart's
            # ValidatingAdmissionPolicy limits the backend to the ai-grid/* and
            # location labels and the ai-grid/* annotations.
            clusterWrites: true
            # The catalog repository. The token that pushes to it is Secret
            # ai-grid-backend-git, never in git; keep it scoped to this
            # repository alone.
            git:
              url: '@catalogRepoURL@'
              branch: main
              # Where the backend writes models. The catalog's delivery, its
              # AppProject and its status Policy all assume this namespace,
              # which rhoai-prerequisites' Policy creates.
              modelsNamespace: ai-grid-internal-models
    # What the chart doesn't hold: ACM Search access for the backend.
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
      targetRevision: cloud-provider
      path: apps/console/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-grid-provider-console
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
