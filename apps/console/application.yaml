apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The cloud provider's admin console on the hub, from its own Helm chart:
  # one pod with kube-auth-proxy (OpenShift sign-in), the console and its
  # backend. It saves models and subscriptions as commits to the catalog
  # repository that apps/acm-models delivers. Before the first sync, run
  # create-secrets.sh (README.md).
  name: console
  namespace: openshift-gitops
spec:
  project: default
  sources:
    # UAT (model hardware, Juntao Wang): the chart from console PR #123's head
    # ad86f73 on the author's fork. Revert this commit to return to console main.
    # A commit, not a branch: the chart holds ClusterRoleBindings and a
    # ValidatingAdmissionPolicy that Argo CD applies with cluster-admin rights.
    - repoURL: https://github.com/DaoDaoNoCode/ai-grid-provider-console.git
      targetRevision: ad86f735be9a2123ab49e660844fe261b29e35a2
      path: charts/ai-grid-provider-console
      helm:
        releaseName: ai-grid-provider-console
        valuesObject:
          # By digest: tags can be overwritten. CI's PR images: console pr-123
          # (38eaf37, its head ad86f73 merged onto main c17e98e) and backend
          # pr-65 (51c6441, its head 276d8c2 merged onto main 5920a52). PR images
          # are allowed on this branch only (Chris, 2026-11-03).
          images:
            console:
              repository: ghcr.io/ai-grid-cloud/ai-grid-provider-console
              tag: pr-123
              digest: sha256:215053ff872548c8af722f9c0f67206d34621ac739b095b72abfd558733f0f69
            backend:
              repository: ghcr.io/ai-grid-cloud/ai-grid-provider-backend
              tag: pr-65
              digest: sha256:b2f0454df5ec073a03d8063d3bc002a36021fc3c89abb2f336d4af77e4eead93
            authProxy:
              tag: ""
              digest: sha256:1a5f6e220362aa2077026bb7e3091c38f80aac861fa060b08045e58e783d5bc5
          console:
            # The Deploy model wizard's Hardware choices (console #123's chart
            # README, "Model hardware"): the chart's defaults.
            models:
              hardware:
                - id: nvidia-gpu
                  label: NVIDIA GPU
                  description: For clusters with NVIDIA GPUs.
                  accelerator: nvidia.com/gpu
                  defaults: {accelerators: 1, cpu: "2", memory: 16Gi}
                - id: cpu
                  label: CPU only
                  description: For x86_64 clusters without GPUs.
                  image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:0ec0f5ff9a5ff263f58db0cfb19e3d7eef24b94c2d8629fe5145f5a8747e28c9
                  env: {VLLM_CPU_KVCACHE_SPACE: "4", OMP_NUM_THREADS: "4"}
                  defaults: {cpu: "4", memory: 8Gi}
            # The Monitoring page: its tabs are the dashboard-* PersesDashboards in
            # one project, here OpenShift AI's, served by the Cluster Observability
            # Operator's Perses on the hub.
            perses:
              url: https://perses.openshift-cluster-observability-operator.svc:8080
              project: redhat-ods-monitoring
          backend:
            # Add to AI Grid and Remove patch ManagedCluster labels. The chart's
            # ValidatingAdmissionPolicy limits the backend to the ai-grid/* and
            # location labels and the ai-grid/* annotations.
            clusterWrites: true
            # The catalog repository. The token that pushes to it is Secret
            # ai-grid-backend-git, never in git; keep it scoped to this
            # repository alone.
            git:
              url: '@catalogRepoURL@'
              branch: main
              # Where the backend writes models. The catalog's delivery, its
              # AppProject and its status Policy all assume this namespace,
              # which rhoai-prerequisites' Policy creates.
              modelsNamespace: ai-grid-internal-models
    # What the chart doesn't hold: ACM Search access for the backend.
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
      targetRevision: cloud-provider
      path: apps/console/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-grid-provider-console
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
