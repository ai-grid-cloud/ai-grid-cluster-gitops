apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  # The one site that holds MaaS's shared state.
  name: maas-home
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  numberOfClusters: 1
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/maas-home: "true"
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
