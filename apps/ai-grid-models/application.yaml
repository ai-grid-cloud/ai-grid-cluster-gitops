apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Model presets for whoever deploys the models (a catalog, the sample in
  # acm-models, by hand): the GPU preset on every inference and combined
  # spoke. The model namespace, its NetworkPolicies and MaaS's grid provider
  # come from the rhoai-prerequisites and tenant Policies.
  name: ai-grid-models
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@templateRepoURL@'
    targetRevision: HEAD
    path: apps/ai-grid-models/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
