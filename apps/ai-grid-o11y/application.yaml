apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-grid-o11y
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
      targetRevision: HEAD
      path: apps/ai-grid-o11y/chart
      helm:
        releaseName: ai-grid-o11y
        # The deployment's inputs (storage class at least): apps/ai-grid-o11y/values-site.yaml.
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/apps/ai-grid-o11y/values-site.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      # Foreground deletion lets the Loki operator recreate children as GC removes them.
      # Remove the owner first; garbage collection then removes its children asynchronously.
      - PrunePropagationPolicy=background
