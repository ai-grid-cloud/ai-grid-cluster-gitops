{{- if eq .Values.objectStorage.mode "obc" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provision-loki-key
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provision-loki-key
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    resourceNames: ["{{ .Values.name }}-bucket"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ .Values.name }}-bucket"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.name }}-bucket"]
    verbs: ["get"]
  # resourceNames cannot restrict `create` (the name is in the request body),
  # so creation is scoped to this namespace only.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provision-loki-key
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: provision-loki-key
subjects:
  - kind: ServiceAccount
    name: provision-loki-key
    namespace: {{ .Values.namespace }}
{{- end }}
