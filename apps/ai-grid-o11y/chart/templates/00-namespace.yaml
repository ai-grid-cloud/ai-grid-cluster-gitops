# The {{ .Values.name }} Perses dashboard and datasource live here; CreateNamespace covers only the destination namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    # Shared with RHOAI monitoring; never prune or delete this namespace.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-1"
