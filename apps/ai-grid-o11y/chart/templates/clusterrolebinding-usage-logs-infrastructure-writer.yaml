apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.name }}-infrastructure-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.name }}-infrastructure-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-writer
    namespace: {{ .Values.namespace }}
