apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: {{ .Values.name }}-all
  namespace: {{ .Values.namespace }}
spec:
  config:
    display:
      name: "All usage (logs)"
    default: false
    plugin:
      kind: "LokiDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: 'https://{{ .Values.name }}-gateway-http.{{ .Values.namespace }}.svc.cluster.local:8080/api/logs/v1/infrastructure'
            allowedEndpoints:
              - endpointPattern: "/loki/api/v1/query"
                method: GET
              - endpointPattern: "/loki/api/v1/query_range"
                method: GET
              - endpointPattern: "/loki/api/v1/labels"
                method: GET
              - endpointPattern: "/loki/api/v1/label/([a-zA-Z0-9_-]+)/values"
                method: GET
            secret: {{ .Values.name }}-all-secret
  client:
    kubernetesAuth:
      enable: true
    tls:
      enable: true
      caCert:
        type: file
        certPath: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
