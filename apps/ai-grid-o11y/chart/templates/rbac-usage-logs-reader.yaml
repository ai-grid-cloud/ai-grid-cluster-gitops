# Read identity for the {{ .Values.name }} tenant: the rollout's synthetic write/read check and any dashboard proxy
# that queries the gateway with a service-account token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}-reader
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.name }}-infrastructure-reader
rules:
  - apiGroups: ["loki.grafana.com"]
    resources: ["infrastructure"]
    resourceNames: ["logs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.name }}-infrastructure-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.name }}-infrastructure-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-reader
    namespace: {{ .Values.namespace }}
