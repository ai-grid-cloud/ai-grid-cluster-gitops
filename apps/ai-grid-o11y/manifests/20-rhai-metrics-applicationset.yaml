# allow-acm-rhai-metrics on every AI Grid spoke, the hub included when it's one.
# Its namespace, redhat-ods-monitoring, appears only once OpenShift AI is up, so
# it's its own Application that retries until then: inside the spoke's rhoai
# Application, the failing dry-run would block the install that creates it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ai-grid-o11y-rhai-metrics
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-spokes
              requeueAfterSeconds: 60
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
  template:
    metadata:
      name: 'ai-grid-o11y-rhai-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/kahowell/ai-grid-tenant.git
        targetRevision: HEAD
        path: apps/ai-grid-o11y/rhai
      destination:
        server: '{{ if eq .name "local-cluster" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: redhat-ods-monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: -1
          backoff:
            duration: 1m
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=false
