apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-0-cluster-admin
  namespace: redhat-ods-monitoring
spec:
  config:
    display:
      name: Cluster
    duration: 1h
    # Namespace variable - queries the cluster-scoped Prometheus datasource, can be overridden by NamespaceVariablesProvider
    variables:
      - kind: ListVariable
        spec:
          name: cluster_name
          display:
            name: "Cluster"
          allowMultiple: true
          allowAllValue: true
          customAllValue: ".*"
          defaultValue: "$__all"
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              datasource:
                kind: PrometheusDatasource
                name: cluster-prometheus-datasource
              labelName: cluster
              matchers:
                - up
      - kind: ListVariable
        spec:
          name: namespace
          display:
            name: Project
            description: Filter by project
          allowMultiple: true
          allowAllValue: true
          customAllValue: ".*"
          defaultValue: "$__all"
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              datasource:
                kind: PrometheusDatasource
                name: cluster-prometheus-datasource
              labelName: namespace
              matchers:
                - 'kube_pod_info{cluster=~"$cluster_name"}'
      # Cluster details variables - set by ClusterDetailsVariablesProvider
      - kind: TextVariable
        spec:
          name: CLUSTER_DETAILS_API_SERVER
          display:
            name: API server
            hidden: true
          value: "N/A"
      - kind: TextVariable
        spec:
          name: CLUSTER_DETAILS_CHANNEL
          display:
            name: Channel
            hidden: true
          value: "N/A"
      - kind: TextVariable
        spec:
          name: CLUSTER_DETAILS_OPENSHIFT_VERSION
          display:
            name: OpenShift version
            hidden: true
          value: "N/A"
      - kind: TextVariable
        spec:
          name: CLUSTER_DETAILS_INFRASTRUCTURE_PROVIDER
          display:
            name: Infrastructure provider
            hidden: true
          value: "N/A"
    panels:
      # Overview Stats
      systemHealth:
        kind: Panel
        spec:
          display:
            name: Nodes
            description: >-
              Node count from kube_node_status_allocatable. Ready-condition
              health is not shown: kube_node_status_condition does not reach
              the hub's Thanos today.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    # Hub Thanos has allocatable but not Ready condition; show
                    # node inventory instead of a fake always-100% health ratio.
                    query: count(count by (cluster, node) (kube_node_status_allocatable{resource="cpu",cluster=~"$cluster_name"}))
                    seriesNameFormat: Nodes
      deployedModels:
        kind: Panel
        spec:
          display:
            name: Deployed models
            description: >-
              Local UWM vLLM metrics have no cluster label, so this panel
              ignores the Cluster dropdown and counts models across every site.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    # Count unique models by model_name and namespace from vLLM metrics
                    query: count(group({__name__=~"kserve_vllm:num_requests_running|vllm:num_requests_running"}) by (model_name, namespace))
                    seriesNameFormat: Deployed models
      gpuUtilizationStat:
        kind: Panel
        spec:
          display:
            name: GPU utilization
            description: >-
              Local UWM GPU metrics have no cluster label, so this panel
              ignores the Cluster dropdown and averages GPUs across every site.
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              format:
                unit: percent
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: avg(accelerator_gpu_utilization{cluster=~"$cluster_name"})
                    seriesNameFormat: GPU usage
      successRate:
        kind: Panel
        spec:
          display:
            name: Request success rate
            description: >-
              Local UWM vLLM metrics have no cluster label, so this panel
              ignores the Cluster dropdown and covers every site.
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              format:
                unit: percent-decimal
                decimalPlaces: 1
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    # Request success rate using kserve_vllm metrics
                    query: (sum(increase({__name__=~"kserve_vllm:request_success_total|vllm:request_success_total", namespace=~"$namespace", finished_reason=~"length|stop"}[$__range])) / sum(increase({__name__=~"kserve_vllm:request_success_total|vllm:request_success_total", namespace=~"$namespace"}[$__range]))) and (sum(increase({__name__=~"kserve_vllm:request_success_total|vllm:request_success_total", namespace=~"$namespace"}[$__range])) > 0)
                    seriesNameFormat: Request success rate
      # Cluster-wide usage - Area charts
      gpuUtilizationArea:
        kind: Panel
        spec:
          display:
            name: GPU utilization
            description: >-
              Local UWM GPU metrics have no cluster label, so this panel
              ignores the Cluster dropdown and averages GPUs across every site.
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.6
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: avg(accelerator_gpu_utilization{cluster=~"$cluster_name"})
                    seriesNameFormat: GPU usage
      memoryUtilizationArea:
        kind: Panel
        spec:
          display:
            name: Memory allocated
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.6
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: sum(container_memory_working_set_bytes{container!="", image!="", cluster=~"$cluster_name"}) / sum(node_memory_MemTotal_bytes{cluster=~"$cluster_name"})
                    seriesNameFormat: Memory allocated
      cpuUtilizationArea:
        kind: Panel
        spec:
          display:
            name: CPU utilization
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.6
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{cluster=~"$cluster_name"}) / sum(kube_node_status_allocatable{resource="cpu",cluster=~"$cluster_name"})
                    seriesNameFormat: CPU usage
      networkUtilizationArea:
        kind: Panel
        spec:
          display:
            name: Inbound traffic
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.6
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: bytes/sec
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    # Network receive rate in bytes/second
                    query: sum(instance:node_network_receive_bytes_excluding_lo:rate1m{cluster=~"$cluster_name"})
                    seriesNameFormat: Network
      gpuUtilizationByProject:
        kind: Panel
        spec:
          display:
            name: GPU utilization
            description: >-
              Local UWM GPU metrics have no cluster label, so this panel
              ignores the Cluster dropdown and shows GPUs across every site.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 1
                connectNulls: false
                display: line
                lineWidth: 0.25
                stack: all
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: sum by (exported_namespace) (accelerator_gpu_utilization{exported_namespace=~"$namespace",cluster=~"$cluster_name"}) / scalar(count(accelerator_gpu_utilization{cluster=~"$cluster_name"}))
                    seriesNameFormat: "{{exported_namespace}}"
      cpuUtilizationByProject:
        kind: Panel
        spec:
          display:
            name: CPU utilization
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 1
                connectNulls: false
                display: line
                lineWidth: 0.25
                stack: all
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    # CPU usage by namespace as percentage of total cluster allocatable CPU
                    query: sum by (namespace) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{namespace=~"$namespace",cluster=~"$cluster_name"}) / scalar(sum(kube_node_status_allocatable{resource="cpu",cluster=~"$cluster_name"}))
                    seriesNameFormat: "{{namespace}}"
      memoryUsageByProject:
        kind: Panel
        spec:
          display:
            name: Memory allocated
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 1
                connectNulls: false
                display: line
                lineWidth: 0.25
                stack: all
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    # Memory allocated by namespace as percentage of total cluster memory
                    query: sum by (namespace) (container_memory_working_set_bytes{namespace=~"$namespace", container!="", image!="",cluster=~"$cluster_name"}) / scalar(sum(node_memory_MemTotal_bytes{cluster=~"$cluster_name"}))
                    seriesNameFormat: "{{namespace}}"
      # Cluster Details - Static Markdown Panel
      clusterDetails:
        kind: Panel
        spec:
          display:
            name: Cluster details
          plugin:
            kind: Markdown
            spec:
              text: |
                <dl class="pf-v6-c-description-list pf-m-auto-column-widths pf-m-horizontal">
                  <div class="pf-v6-c-description-list__group">
                    <dt class="pf-v6-c-description-list__term">
                      <span class="pf-v6-c-description-list__text">Provider</span>
                    </dt>
                    <dd class="pf-v6-c-description-list__description">
                      <div class="pf-v6-c-description-list__text">${CLUSTER_DETAILS_INFRASTRUCTURE_PROVIDER}</div>
                    </dd>
                  </div>
                  <div class="pf-v6-c-description-list__group">
                    <dt class="pf-v6-c-description-list__term">
                      <span class="pf-v6-c-description-list__text">OpenShift version</span>
                    </dt>
                    <dd class="pf-v6-c-description-list__description">
                      <div class="pf-v6-c-description-list__text">${CLUSTER_DETAILS_OPENSHIFT_VERSION}</div>
                    </dd>
                  </div>
                  <div class="pf-v6-c-description-list__group">
                    <dt class="pf-v6-c-description-list__term">
                      <span class="pf-v6-c-description-list__text">Channel</span>
                    </dt>
                    <dd class="pf-v6-c-description-list__description">
                      <div class="pf-v6-c-description-list__text">${CLUSTER_DETAILS_CHANNEL}</div>
                    </dd>
                  </div>
                  <div class="pf-v6-c-description-list__group">
                    <dt class="pf-v6-c-description-list__term">
                      <span class="pf-v6-c-description-list__text">API server</span>
                    </dt>
                    <dd class="pf-v6-c-description-list__description">
                      <div class="pf-v6-c-description-list__text">${CLUSTER_DETAILS_API_SERVER}</div>
                    </dd>
                  </div>
                </dl>
      # Grid gateway stats
      gridGatewaysReporting:
        kind: Panel
        spec:
          display:
            name: Grid gateways reporting
            description: >-
              Clusters whose grid gateway exported metrics in the last scrape. A site that serves models but routes nothing runs no gateway and does not count.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: >-
                      count(count by (cluster) (grid_dial_down{cluster=~"$cluster_name"})) or vector(0)
                    seriesNameFormat: Grid gateways reporting
      gridBackendsUnreachable:
        kind: Panel
        spec:
          display:
            name: Grid backends unreachable
            description: >-
              Candidates a grid gateway cannot dial right now, summed over the selected clusters. Requests for those models go to the remaining candidates.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: >-
                      sum(grid_dial_down{cluster=~"$cluster_name"}) or vector(0)
                    seriesNameFormat: Grid backends unreachable
      gridCandidatesWithoutRoute:
        kind: Panel
        spec:
          display:
            name: Grid candidates without a route
            description: >-
              Candidates in a gateway's serving config it has no way to reach, with no address yet or a dial the site's policy refused. These never receive requests.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: >-
                      (sum(grid_serving_undialable_clusters{cluster=~"$cluster_name"}) or vector(0)) + (sum(grid_serving_refused_dial_clusters{cluster=~"$cluster_name"}) or vector(0))
                    seriesNameFormat: Grid candidates without a route
      gridLoadReadingFetchSuccess:
        kind: Panel
        spec:
          display:
            name: Grid load reading fetch success rate
            description: >-
              Share of the gateways' fetches of peer sites' load readings that succeeded. Below 100% a peer is routed on its last good reading until it answers again.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: percent-decimal
                decimalPlaces: 1
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: cluster-prometheus-datasource
                    query: >-
                      sum(rate(grid_signals_poll_total{result="ok",cluster=~"$cluster_name"}[$__rate_interval])) / (sum(rate(grid_signals_poll_total{cluster=~"$cluster_name"}[$__rate_interval])) > 0)
                    seriesNameFormat: Grid load reading fetch success rate
    layouts:
      # Overview Section - Stats Row
      - kind: Grid
        spec:
          display:
            title: Overview
            collapse:
              open: true
          items:
            - x: 0
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/systemHealth'
            - x: 6
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/deployedModels'
            - x: 12
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/gpuUtilizationStat'
            - x: 18
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/successRate'
      # Grid gateway Section - Stats Row
      - kind: Grid
        spec:
          display:
            title: Grid gateway
            collapse:
              open: true
          items:
            - x: 0
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/gridGatewaysReporting'
            - x: 6
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/gridBackendsUnreachable'
            - x: 12
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/gridCandidatesWithoutRoute'
            - x: 18
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/gridLoadReadingFetchSuccess'
      # Cluster-wide usage section
      - kind: Grid
        spec:
          display:
            title: Cluster resource overview
            collapse:
              open: true
          items:
            - x: 0
              'y': 0
              width: 12
              height: 8
              content:
                '$ref': '#/spec/panels/gpuUtilizationArea'
            - x: 12
              'y': 0
              width: 12
              height: 8
              content:
                '$ref': '#/spec/panels/memoryUtilizationArea'
            - x: 0
              'y': 8
              width: 12
              height: 8
              content:
                '$ref': '#/spec/panels/cpuUtilizationArea'
            - x: 12
              'y': 8
              width: 12
              height: 8
              content:
                '$ref': '#/spec/panels/networkUtilizationArea'
      # Project resource usage Section
      - kind: Grid
        spec:
          display:
            title: Project resource usage
            collapse:
              open: true
          items:
            - x: 0
              'y': 0
              width: 8
              height: 10
              content:
                '$ref': '#/spec/panels/gpuUtilizationByProject'
            - x: 8
              'y': 0
              width: 8
              height: 10
              content:
                '$ref': '#/spec/panels/cpuUtilizationByProject'
            - x: 16
              'y': 0
              width: 8
              height: 10
              content:
                '$ref': '#/spec/panels/memoryUsageByProject'
      # Cluster Details Section
      - kind: Grid
        spec:
          display:
            title: Cluster details
            collapse:
              open: true
          items:
            - x: 0
              'y': 0
              width: 24
              height: 8
              content:
                '$ref': '#/spec/panels/clusterDetails'
