# Read identity for the usage-logs tenant: the rollout's synthetic write/read check and any dashboard proxy
# that queries the gateway with a service-account token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-logs-reader
  namespace: redhat-ods-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: usage-logs-infrastructure-reader
rules:
  - apiGroups: ["loki.grafana.com"]
    resources: ["infrastructure"]
    resourceNames: ["logs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: usage-logs-infrastructure-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: usage-logs-infrastructure-reader
subjects:
  - kind: ServiceAccount
    name: usage-logs-reader
    namespace: redhat-ods-monitoring
