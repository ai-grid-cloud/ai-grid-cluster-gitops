# The identity a site's collector authenticates to this store as.
# clusterrolebinding-usage-logs-infrastructure-writer.yaml already names it as
# its subject; without this the binding grants its ClusterRole to nothing and
# no site can write. apps/ai-grid-usage-logs mints the token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-logs-writer
  namespace: redhat-ods-monitoring
