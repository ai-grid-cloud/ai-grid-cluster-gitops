# The ODF operator channel tracks the cluster's OpenShift minor version
# (stable-<major.minor>). The dedicated-hub ApplicationSet overrides this from
# the cluster's openshiftVersion-major-minor label; this default covers the
# combined-hub bootstrap, which has no cluster labels to draw from.
openshift:
  version: "4.22"

# OLM fails every CSV in a namespace with two OperatorGroups. Set false when
# openshift-storage already has one, for example from an LVMS install.
operatorGroup:
  create: true
