apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odf
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/jeffdyoung/ai-grid-cluster-gitops.git
    targetRevision: jeyounghub1
    path: apps/odf/chart
    helm:
      releaseName: odf
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
