apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Example identity providers, organizations, and test realms.
# Enabled per environment through the overlays/examples overlay.
resources:
  - signing-keys-grid.yaml
configMapGenerator:
  - name: keycloak-realm-import
    behavior: merge
    files:
      - saas-realm.json
      - grid-tenant-1-idp-realm.json
      - grid-tenant-2-idp-realm.json
patches:
  - path: keycloak-grid-keystores.patch.yaml
