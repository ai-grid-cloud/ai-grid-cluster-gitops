apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Example identity providers, organizations, and test realms.
# Enabled by the default overlay. The core overlay omits it.
resources:
  - signing-keys-grid.yaml
configMapGenerator:
  - name: keycloak-realm-import
    behavior: merge
    files:
      - saas-realm.json
      - grid-tenant-1-idp-realm.json
      - grid-tenant-2-idp-realm.json
patches:
  - path: keycloak-grid-keystores.patch.yaml
  - target:
      kind: Certificate
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false,Delete=false
