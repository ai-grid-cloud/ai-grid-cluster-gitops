apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      initContainers:
        - name: render-realm-import
          image: quay.io/keycloak/keycloak:26.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail

              render_realm() {
                local line
                while IFS= read -r line || [[ -n "$line" ]]; do
                  line=${line//\$\{KEYCLOAK_CLIENT_ID\}/$KEYCLOAK_CLIENT_ID}
                  line=${line//\$\{KEYCLOAK_HOME_URL\}/$KEYCLOAK_HOME_URL}
                  line=${line//\$\{KEYCLOAK_PUBLIC_URL\}/$KEYCLOAK_PUBLIC_URL}
                  line=${line//\$\{KEYCLOAK_REDIRECT_URI\}/$KEYCLOAK_REDIRECT_URI}
                  line=${line//\$\{KEYCLOAK_CLIENT_SECRET\}/$KEYCLOAK_CLIENT_SECRET}
                  line=${line//\$\{KEYCLOAK_SIGNING_KEYSTORE_PASSWORD\}/$KEYCLOAK_SIGNING_KEYSTORE_PASSWORD}
                  # The deployment's own placeholders, such as its tenant IdPs'
                  # broker secrets: keys its overlay adds to keycloak-secrets.
                  for name in $REALM_VARS; do
                    line=${line//"\${$name}"/"${!name}"}
                  done
                  printf '%s\n' "$line"
                done
              }

              for source in /opt/keycloak/realm-import-source/*.json; do
                target="/opt/keycloak/data/import/$(basename "$source")"
                render_realm < "$source" > "$target"
              done
          envFrom:
            - secretRef:
                name: keycloak-secrets
            - configMapRef:
                name: keycloak-public-url
          env:
            # Space-separated; the deployment overlay sets it.
            - name: REALM_VARS
              value: ""
            - name: KEYCLOAK_SIGNING_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-signing-keystore-password
                  key: password
          volumeMounts:
            - name: realm-import-source
              mountPath: /opt/keycloak/realm-import-source
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              # REALM_IMPORT_OVERRIDE true replaces each realm from its JSON at
              # every start, dropping whatever was changed at runtime (users,
              # organizations, clients); false creates only missing realms. A
              # deployment whose console writes organizations sets false.
              /opt/keycloak/bin/kc.sh import --dir /opt/keycloak/data/import --override "$REALM_IMPORT_OVERRIDE"
              exec /opt/keycloak/bin/kc.sh start
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          envFrom:
            - secretRef:
                name: keycloak-secrets
            - configMapRef:
                name: keycloak-public-url
          env:
            - name: REALM_IMPORT_OVERRIDE
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: maas-db-rw
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
            - name: KC_DB_TLS_MODE
              value: verify-server
            - name: KC_DB_TLS_TRUST_STORE_FILE
              value: /opt/keycloak/database-ca/ca.crt
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: keycloak-public-url
                  key: KEYCLOAK_PUBLIC_URL
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: database-ca
              mountPath: /opt/keycloak/database-ca
              readOnly: true
            - name: saas-signing-key
              mountPath: /opt/keycloak/data/saas
              readOnly: true
            - name: grid-tenant-1-idp-signing-key
              mountPath: /opt/keycloak/data/grid-tenant-1-idp
              readOnly: true
            - name: grid-tenant-2-idp-signing-key
              mountPath: /opt/keycloak/data/grid-tenant-2-idp
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: database-ca
          secret:
            secretName: maas-db-ca
        - name: saas-signing-key
          secret:
            secretName: keycloak-saas-signing
            items:
              - key: keystore.jks
                path: keystore.jks
        - name: grid-tenant-1-idp-signing-key
          secret:
            secretName: keycloak-grid-tenant-1-idp-signing
            items:
              - key: keystore.jks
                path: keystore.jks
        - name: grid-tenant-2-idp-signing-key
          secret:
            secretName: keycloak-grid-tenant-2-idp-signing
            items:
              - key: keystore.jks
                path: keystore.jks
        - name: realm-import-source
          configMap:
            name: keycloak-realm-import
        - name: realm-import
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
