apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maas-db
resources:
  - manifests/secrets.yaml
  - manifests/signing-keys.yaml
  - manifests/database.yaml
  - manifests/public-url-policy.yaml
  - manifests/tenant-templating-rbac.yaml
  - manifests/keycloak.yaml
  - manifests/route.yaml
# The realms are the deployment's: its overlay of this directory adds the
# keycloak-realm-import ConfigMap (deployment/keycloak/ is this repository's
# own).
