apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: maas-db
spec:
  template:
    spec:
      containers:
        - name: keycloak
          args:
            - |
              /opt/keycloak/bin/kc.sh import --dir /opt/keycloak/data/import --override true
              exec /opt/keycloak/bin/kc.sh start
