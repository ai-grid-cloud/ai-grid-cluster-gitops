apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Default install: core plus the grid-tenant example realms, identity
# providers, organizations, and signing keys. The import mode comes from base
# (REALM_IMPORT_OVERRIDE, default false: create missing realms only, so
# console-made organizations survive restarts).
resources:
  - ../../base
components:
  - ../../components/examples
