apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: keycloak
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster:
    name: maas-db
  name: keycloak
  login: true
  passwordSecret:
    name: keycloak-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  cluster:
    name: maas-db
  name: keycloak
  owner: keycloak
