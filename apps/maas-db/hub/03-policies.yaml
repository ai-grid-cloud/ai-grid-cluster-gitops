apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: maas-db-replication-secrets
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS
    policy.open-cluster-management.io/controls: PR.DS-1
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: maas-db-replication-secrets
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - maas-db
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-replication
                  namespace: maas-db
                type: kubernetes.io/tls
                data:
                  tls.crt: '{{hub fromSecret "maas-db" "maas-db-replication" "tls.crt" hub}}'
                  tls.key: '{{hub fromSecret "maas-db" "maas-db-replication" "tls.key" hub}}'
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-ca
                  namespace: maas-db
                type: Opaque
                data:
                  ca.crt: '{{hub fromSecret "maas-db" "maas-db-ca" "ca.crt" hub}}'
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-app
                  namespace: maas-db
                type: kubernetes.io/basic-auth
                data:
                  username: '{{hub fromSecret "maas-db" "maas-db-app" "username" hub}}'
                  password: '{{hub fromSecret "maas-db" "maas-db-app" "password" hub}}'
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: maas-db-api-credentials
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS
    policy.open-cluster-management.io/controls: PR.DS-1
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: maas-db-api-connection
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - redhat-ai-gateway-infra
          # channel_binding=require: SCRAM bound to the TLS channel
          # (SCRAM-SHA-256-PLUS), so a server impersonating the database can't
          # complete the login, and the password is never sent. verify-full
          # would need the database CA as a file in maas-api, whose Deployment
          # the operator owns.
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-config
                  namespace: redhat-ai-gateway-infra
                type: Opaque
                stringData:
                  DB_CONNECTION_URL: '{{hub printf "postgresql://%s:%s@maas-db-rw.maas-db.svc.clusterset.local:5432/%s?sslmode=require&channel_binding=require" (fromSecret "maas-db" "maas-db-app" "username" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "password" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "dbname" | base64dec) hub}}'
                  DB_READ_CONNECTION_URL: '{{hub printf "postgresql://%s:%s@maas-read-ro.maas-db.svc.cluster.local:5432/%s?sslmode=require&channel_binding=require" (fromSecret "maas-db" "maas-db-app" "username" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "password" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "dbname" | base64dec) hub}}'
            # A remote spoke's maas-api reaches the hub's primary through
            # Submariner, at its Globalnet address, and MaaS builds that
            # restrict maas-api's egress admit 5432 only to postgres pods on
            # its own cluster. So allow that one address, 5432 only: the
            # primary Service's GlobalIngressIP, read on the hub. Without one
            # the CIDR is invalid and the Policy fails closed. Harmless where
            # egress isn't restricted. mustonlyhave: musthave never removes list
            # items, so a reallocated address would leave the old one allowed.
            # From ai-grid-env-setup's maas-db Policy (Apache-2.0).
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: maas-api-to-clusterset-db
                  namespace: redhat-ai-gateway-infra
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/component: api
                      app.kubernetes.io/name: maas-api
                      app.kubernetes.io/part-of: models-as-a-service
                  policyTypes:
                    - Egress
                  egress:
                    - to:
                        - ipBlock:
                            cidr: '{{hub (lookup "submariner.io/v1" "GlobalIngressIP" "maas-db" "maas-db-rw").status.allocatedIP hub}}/32'
                      ports:
                        - port: 5432
                          protocol: TCP
