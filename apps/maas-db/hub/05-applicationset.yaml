apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maas-db
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # No preserveResourcesOnDeletion here, unlike rhoai: a replica is a full copy
  # of every tenant's API keys and subscriptions, with the replication
  # credentials, so a site that leaves the grid, or the ingress role, loses it
  # with its Application.
  generators:
    # The primary on the hub, while the hub is an AI Grid site.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-spokes
              requeueAfterSeconds: 60
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
                matchExpressions:
                  - key: name
                    operator: In
                    values:
                      - local-cluster
    # A read replica on every other site that runs MaaS: role ingress or
    # combined (apps/ai-grid-spokes). The Placement's live decisions,
    # not the Secret's labels alone, as in the rhoai ApplicationSet.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-ingress
              requeueAfterSeconds: 60
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
                matchExpressions:
                  - key: name
                    operator: NotIn
                    values:
                      - local-cluster
  template:
    metadata:
      name: 'maas-db-{{.name}}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/kahowell/ai-grid-tenant.git
        targetRevision: HEAD
        path: '{{ if eq .name "local-cluster" }}apps/maas-db/local-cluster{{ else }}apps/maas-db/read-clusters{{ end }}'
      destination:
        server: '{{.server}}'
        namespace: maas-db
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
