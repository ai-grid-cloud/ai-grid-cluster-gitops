apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maas-db
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The primary on the hub, whether or not the hub is an AI Grid spoke.
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
            name: local-cluster
    # A read replica on every other spoke that runs MaaS: ingress and combined
    # (apps/ai-grid-spokes).
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-ingress
              requeueAfterSeconds: 60
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
                matchExpressions:
                  - key: name
                    operator: NotIn
                    values:
                      - local-cluster
                  # As in the rhoai ApplicationSet: wait for the role on the Secret.
                  - key: ai-grid/role
                    operator: In
                    values: [ingress, inference, combined]
  template:
    metadata:
      name: 'maas-db-{{.name}}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/kahowell/ai-grid-tenant.git
        targetRevision: HEAD
        path: '{{ if eq .name "local-cluster" }}apps/maas-db/local-cluster{{ else }}apps/maas-db/read-clusters{{ end }}'
      destination:
        server: '{{.server}}'
        namespace: maas-db
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
