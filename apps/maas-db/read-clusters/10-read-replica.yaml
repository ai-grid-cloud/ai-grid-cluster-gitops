apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: maas-read
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instances: 1
  # maas-api's egress NetworkPolicy (maas-api-egress-restrict, in builds that
  # restrict egress) allows 5432 only to pods labelled app=postgres. That
  # covers a database on maas-api's own cluster only: a remote spoke reaching
  # the hub's primary by its clusterset name gets its own egress rule
  # (maas-api-to-clusterset-db, hub/03-policies.yaml).
  inheritedMetadata:
    labels:
      app: postgres
  bootstrap:
    pg_basebackup:
      database: maas
      owner: maas_api
      secret:
        name: maas-db-app
      source: maas-db
  replica:
    enabled: true
    source: maas-db
  externalClusters:
    - name: maas-db
      connectionParameters:
        host: maas-db-rw.maas-db.svc.clusterset.local
        user: streaming_replica
        sslmode: verify-full
        dbname: postgres
      sslKey:
        name: maas-db-replication
        key: tls.key
      sslCert:
        name: maas-db-replication
        key: tls.crt
      sslRootCert:
        name: maas-db-ca
        key: ca.crt
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
