apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: maas-db
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instances: 3
  # maas-api's egress NetworkPolicy (maas-api-egress-restrict, in builds that
  # restrict egress) allows 5432 only to pods labelled app=postgres. That
  # covers a database on maas-api's own cluster only: a remote spoke reaching
  # the hub's primary by its clusterset name gets its own egress rule
  # (maas-api-to-clusterset-db, hub/03-policies.yaml).
  inheritedMetadata:
    labels:
      app: postgres
  certificates:
    serverAltDNSNames:
      - maas-db-rw.maas-db.svc.clusterset.local
  bootstrap:
    initdb:
      database: maas
      owner: maas_api
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
