# maas-db-rw is exported to every cluster in the cluster set. This keeps
# other pods on the hub out: the namespace admits only its own pods, maas-api,
# the CloudNativePG operator, monitoring, the router to Keycloak (which runs
# here, apps/keycloak), and, on 5432, Submariner Globalnet addresses (the
# Broker's default 242.0.0.0/8) for other clusters' replicas and maas-api.
# Every pod on a joined cluster egresses from that range, so across clusters
# the boundary is the database password and SCRAM, not this policy; narrowing
# it needs a GlobalEgressIP for maas-api's and the replicas' namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maas-db-ingress
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # The namespace's own pods: replication and the instance manager.
    - from:
        - podSelector: {}
    # maas-api.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ai-gateway-infra
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
      ports:
        - port: 5432
          protocol: TCP
    # The CloudNativePG operator (instance status) and cluster monitoring.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 9187
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 242.0.0.0/8
      ports:
        - port: 5432
          protocol: TCP
    - from:
        # Also matches host-network routers on OVN-Kubernetes.
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - port: 8080
          protocol: TCP
