# RHOAI's collector scrapes the primary's instances through this monitor. It replaces the
# PodMonitor CloudNativePG generates from spec.monitoring.enablePodMonitor, which is deprecated.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: maas-db-metrics
  namespace: maas-db
  labels:
    monitoring.opendatahub.io/scrape: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    # Part of the primary database: deleting the Application never deletes it.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: maas-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
