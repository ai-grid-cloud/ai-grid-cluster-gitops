# The namespace for the AI Grid Policies the provider console reads, with the
# ClusterSet binding their Placements use. The Placements, by role, are
# apps/ai-grid-spokes'.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-grid-policies
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: ai-grid-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterSet: global
