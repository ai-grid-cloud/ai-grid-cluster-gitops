apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  # The controller now caches both the in-cluster destination and the
  # GitOpsCluster proxy destination; 2 GiB is not enough during startup.
  controller:
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
  # Keep the operator defaults and grant the existing direct cluster-admin
  # user access to the Argo CD UI.
  rbac:
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, pdipilat, role:admin
