apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  # Allows the Placement in this namespace to select clusters from the
  # reserved global cluster set.
  name: global
  namespace: openshift-gitops
  annotations:
    # Needs ACM's CRDs, which a fresh hub doesn't have yet. Skipping the dry
    # run keeps this object from failing the whole sync, so the controller's
    # memory in argocd.yaml still applies; this object follows on a retry once
    # ACM is in.
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterSet: global
