apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  # Allows the Placement in this namespace to select clusters from the
  # reserved global cluster set.
  name: global
  namespace: openshift-gitops
  annotations:
    # Needs ACM's CRDs, which a fresh hub doesn't have yet. Skipping the dry
    # run, and a later wave than the ArgoCD fields, lets the controller's
    # memory apply first; this object follows on a retry once ACM is in.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterSet: global
