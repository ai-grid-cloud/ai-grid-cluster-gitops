apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Uses server-side apply so this app owns only the controller sizing and the
  # openshift-gitops cluster-set binding. The cluster-admins Group's members
  # are the deployment's: it ships that Group as one of its own apps (the lab
  # roots add bootstrap/lab/gitops-config as a second source).
  name: gitops-config
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@libraryRepoURL@'
    targetRevision: '@libraryRevision@'
    path: apps/gitops-config/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      # The ArgoCD CR is owned by the OpenShift GitOps operator; pruning the
      # Application must not delete that instance.
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
