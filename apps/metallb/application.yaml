apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@libraryRepoURL@'
    targetRevision: '@libraryRevision@'
    path: apps/metallb/hub
    # The library's own repository and revision for the ApplicationSets in
    # this directory (its inputs.yaml), from the root's values.
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: library-inputs
          patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: library-inputs
            data:
              libraryRepoURL: '@libraryRepoURL@'
              libraryRevision: '@libraryRevision@'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
