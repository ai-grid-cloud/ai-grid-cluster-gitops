# A kustomization so apps/metallb/application.yaml can hand the ApplicationSet
# the library's repository and revision (inputs.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - inputs.yaml
  - 00-applicationset.yaml
replacements:
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRepoURL
    targets:
      - select:
          kind: ApplicationSet
          name: metallb
        fieldPaths:
          - spec.template.spec.sources.[ref=values].repoURL
          - spec.template.spec.sources.[path=apps/metallb/chart].repoURL
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.libraryRevision
    targets:
      - select:
          kind: ApplicationSet
          name: metallb
        fieldPaths:
          - spec.template.spec.sources.[ref=values].targetRevision
          - spec.template.spec.sources.[path=apps/metallb/chart].targetRevision
