---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-controller-metrics-compat
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-controller-metrics-compat
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: DeleteAll
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: ai-grid-controller-metrics-compat
                  namespace: redhat-ods-monitoring
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
            # Metadata only: the token controller supplies data and the allocator watches for rotation.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                type: kubernetes.io/service-account-token
                metadata:
                  name: ai-grid-controller-metrics-compat-token
                  namespace: redhat-ods-monitoring
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                  annotations:
                    kubernetes.io/service-account.name: ai-grid-controller-metrics-compat
            # A dedicated injected bundle avoids depending on another operand's CA ConfigMap lifecycle.
            # Its data is maintained by the service CA operator, not this policy or the token Secret.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: ai-grid-controller-metrics-compat-ca
                  namespace: redhat-ods-monitoring
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                  annotations:
                    service.beta.openshift.io/inject-cabundle: "true"
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: ai-grid-controller-metrics-compat
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                rules:
                  - nonResourceURLs: ["/metrics"]
                    verbs: ["get"]
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: ai-grid-controller-metrics-compat
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: ai-grid-controller-metrics-compat
                subjects:
                  - kind: ServiceAccount
                    name: ai-grid-controller-metrics-compat
                    namespace: redhat-ods-monitoring
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: ServiceMonitor
                metadata:
                  name: ai-grid-gateway-controller-metrics-compat
                  namespace: redhat-ods-monitoring
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                    monitoring.opendatahub.io/scrape: "true"
                spec:
                  namespaceSelector:
                    matchNames: [redhat-ods-applications]
                  selector:
                    matchLabels:
                      app: ai-gateway-controller
                      control-plane: ai-gateway-controller
                  endpoints:
                    - port: metrics
                      path: /metrics
                      scheme: https
                      interval: 30s
                      authorization:
                        type: Bearer
                        credentials:
                          name: ai-grid-controller-metrics-compat-token
                          key: token
                      tlsConfig:
                        ca:
                          configMap:
                            name: ai-grid-controller-metrics-compat-ca
                            key: service-ca.crt
                        serverName: ai-gateway-controller-metrics.redhat-ods-applications.svc
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: rhoai-controller-metrics-compat
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "3"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: rhoai-controller-metrics-sites
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: rhoai-controller-metrics-compat
