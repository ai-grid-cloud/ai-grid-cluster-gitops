# Compatibility for RHOAIENG-102689: the product's three bearerTokenFile monitors are rejected by the
# RHOAI collector's denyFSAccessThroughSMs guard. Keep that guard and target-allocator mTLS enabled.
# MaaS API/controller monitors go to ingress/combined sites; AI Gateway and the shared controller
# credentials below go to every RHOAI grid site, since AI Gateway also runs without MaaS.
# Preserve the existing API object names for upgrades. Controller monitors/credentials live in
# redhat-ods-monitoring because the allocator must not gain Secret access to redhat-ods-applications.
# Product NetworkPolicies already admit collector traffic on API 9090 and controller 8443.
# Retire these compatibility monitors in a reviewed handoff when the native jobs work, avoiding
# duplicate scrapes; then remove their credentials/grants. Policy deletion prunes these owned objects.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-ingress-sites
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            - key: ai-grid/role
              operator: In
              values: [ingress, combined]
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-maas-api-metrics
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-maas-api-metrics
        spec:
          remediationAction: enforce
          severity: medium
          # Removed from a site that leaves the ingress or combined role.
          pruneObjectBehavior: DeleteAll
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: ai-grid-maas-api-metrics
                  namespace: redhat-ai-gateway-infra
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
            # The token controller fills this Secret; never enforce its data. These manually provisioned
            # tokens do not rotate automatically: rotate/revoke the owned token Secrets under review.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                type: kubernetes.io/service-account-token
                metadata:
                  name: ai-grid-maas-api-metrics-token
                  namespace: redhat-ai-gateway-infra
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                  annotations:
                    kubernetes.io/service-account.name: ai-grid-maas-api-metrics
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: ai-grid-metrics-reader
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                rules:
                  - nonResourceURLs: ["/metrics"]
                    verbs: ["get"]
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: ai-grid-maas-api-metrics
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: ai-grid-metrics-reader
                subjects:
                  - kind: ServiceAccount
                    name: ai-grid-maas-api-metrics
                    namespace: redhat-ai-gateway-infra
            # Same Service, port, path, CA and server name as RHOAI's maas-api-metrics; the token comes from
            # the Secret above instead of a file.
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: ServiceMonitor
                metadata:
                  name: ai-grid-maas-api-metrics
                  namespace: redhat-ai-gateway-infra
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                    monitoring.opendatahub.io/scrape: "true"
                spec:
                  selector:
                    matchLabels:
                      app.kubernetes.io/name: maas-api
                      maas.opendatahub.io/metrics: "true"
                  endpoints:
                    - port: https
                      path: /metrics
                      scheme: https
                      interval: 30s
                      authorization:
                        type: Bearer
                        credentials:
                          name: ai-grid-maas-api-metrics-token
                          key: token
                      tlsConfig:
                        ca:
                          configMap:
                            name: openshift-service-ca.crt
                            key: service-ca.crt
                        serverName: maas-api-metrics.redhat-ai-gateway-infra.svc
            # Credentials and CA are resolved in this monitor's namespace, not the Service's namespace.
            # The shared controller identity and CA are provisioned by rhoai-controller-metrics-compat below.
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: ServiceMonitor
                metadata:
                  name: ai-grid-maas-controller-metrics-compat
                  namespace: redhat-ods-monitoring
                  labels:
                    app.kubernetes.io/part-of: ai-grid
                    ai-grid/compatibility: rhoaieng-102689
                    monitoring.opendatahub.io/scrape: "true"
                spec:
                  namespaceSelector:
                    matchNames: [redhat-ods-applications]
                  selector:
                    matchLabels:
                      app: maas-controller
                      control-plane: maas-controller
                  endpoints:
                    - port: metrics
                      path: /metrics
                      scheme: https
                      interval: 30s
                      authorization:
                        type: Bearer
                        credentials:
                          name: ai-grid-controller-metrics-compat-token
                          key: token
                      tlsConfig:
                        ca:
                          configMap:
                            name: ai-grid-controller-metrics-compat-ca
                            key: service-ca.crt
                        serverName: maas-controller-metrics.redhat-ods-applications.svc
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: rhoai-maas-api-metrics
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "3"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: rhoai-ingress-sites
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: rhoai-maas-api-metrics
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-controller-metrics-sites
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            - key: ai-grid/role
              operator: In
              values: [ingress, inference, combined]
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
