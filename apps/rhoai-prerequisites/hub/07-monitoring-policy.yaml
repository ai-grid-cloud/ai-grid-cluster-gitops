# COO is required by RHOAI's MonitoringStack on each site. Reuse an existing installation
# (including ACM's on the hub); otherwise install it without a competing OperatorGroup.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-monitoring
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-cluster-observability-operator
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: None
          object-templates-raw: |
            {{- /* An operator installed by anyone else (any namespace, any channel) is adopted as is. */ -}}
            {{- $installed := false }}
            {{- range (lookup "operators.coreos.com/v1alpha1" "Subscription" "" "").items }}
            {{- if eq .spec.name "cluster-observability-operator" }}{{ $installed = true }}{{ end }}
            {{- end }}
            {{- if not $installed }}
            {{- $ns := "openshift-cluster-observability-operator" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $ns }}
            {{- /* The operator supports AllNamespaces only: an existing group must be a single all-namespaces one. */ -}}
            {{- $groups := (lookup "operators.coreos.com/v1" "OperatorGroup" $ns "").items }}
            {{- if gt (len $groups) 1 }}{{ fail (printf "namespace %s has %d OperatorGroups; the operator needs exactly one" $ns (len $groups)) }}{{ end }}
            {{- range $groups }}
            {{- if or .spec.targetNamespaces .spec.selector }}{{ fail (printf "OperatorGroup %s/%s targets namespaces; the operator needs an all-namespaces group" $ns .metadata.name) }}{{ end }}
            {{- end }}
            {{- if not $groups }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: {{ $ns }}
                  namespace: {{ $ns }}
                spec: {}
            {{- end }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: cluster-observability-operator
                  namespace: {{ $ns }}
                spec:
                  channel: stable
                  installPlanApproval: Automatic
                  name: cluster-observability-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
            {{- end }}
