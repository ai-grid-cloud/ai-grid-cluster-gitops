apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-prerequisites-clusters
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  # Clusters with an ai-grid/role label (any value), plus the hub: the hub's
  # grid enrollment pulls an unreleased registry.redhat.io/rhoai image through
  # this Policy's mirror and pull secret. Predicates are ORed. Other clusters
  # get nothing.
  # Keyed on the role, not ai-grid/enabled: a console Remove drops only
  # ai-grid/enabled and keeps the site's OpenShift AI (the rhoai ApplicationSet
  # preserves it), which still needs the mirror and the pull secret.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: ai-grid/role
              operator: Exists
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            local-cluster: "true"
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-prerequisites-remote-clusters
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: local-cluster
              operator: NotIn
              values:
                - "true"
            # The external-services cluster runs Redis itself (apps/external-services).
            - key: ai-grid/external-services
              operator: NotIn
              values:
                - "true"
