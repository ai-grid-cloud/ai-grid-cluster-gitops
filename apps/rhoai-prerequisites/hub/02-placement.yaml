apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-prerequisites-clusters
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  # Skip hosted control plane clusters (ROSA HCP, HyperShift). Their
  # openshift-config/pull-secret is owned by the management cluster, which
  # reverts every write, and their ImageDigestMirrorSets are denied by a
  # ValidatingAdmissionPolicy, so the Policy can only loop or fail there.
  predicates:
    - requiredClusterSelector:
        claimSelector:
          matchExpressions:
            - key: hostedcluster.hypershift.openshift.io
              operator: DoesNotExist
