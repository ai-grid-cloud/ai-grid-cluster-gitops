apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-prerequisites-clusters
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  # Grid spokes, plus the hub: the hub's grid enrollment pulls an unreleased
  # registry.redhat.io/rhoai image through this Policy's mirror and pull secret.
  # Predicates are ORed. Clusters outside the grid get nothing.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            local-cluster: "true"
