# A kustomization so apps/acm-models/application.yaml can hand it the catalog
# repository and branch (inputs.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - inputs.yaml
  - catalog-03-appprojects.yaml
  - catalog-04-applicationsets.yaml
  - gitops-cluster.yaml
replacements:
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.catalogRepoURL
    targets:
      - select:
          kind: AppProject
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: ApplicationSet
          name: acm-models-catalog-models
        fieldPaths:
          - spec.generators.0.matrix.generators.1.git.repoURL
          - spec.template.spec.source.repoURL
      - select:
          kind: ApplicationSet
          name: acm-models-catalog-ingress
        fieldPaths:
          - spec.generators.0.matrix.generators.1.git.repoURL
          - spec.template.spec.source.repoURL
      - select:
          kind: ApplicationSet
          name: acm-models-catalog-subscriptions
        fieldPaths:
          - spec.generators.0.matrix.generators.1.git.repoURL
          - spec.template.spec.source.repoURL
  - source:
      kind: ConfigMap
      name: library-inputs
      fieldPath: data.catalogRevision
    targets:
      - select:
          kind: ApplicationSet
          name: acm-models-catalog-models
        fieldPaths:
          - spec.generators.0.matrix.generators.1.git.revision
          - spec.template.spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: acm-models-catalog-ingress
        fieldPaths:
          - spec.generators.0.matrix.generators.1.git.revision
          - spec.template.spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: acm-models-catalog-subscriptions
        fieldPaths:
          - spec.generators.0.matrix.generators.1.git.revision
          - spec.template.spec.source.targetRevision
