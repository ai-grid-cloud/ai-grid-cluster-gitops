apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Generates one Application for every cluster selected by the
  # acm-models-smollm2-135m-instruct Placement.
  name: acm-models-smollm2-135m-instruct
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: acm-models-smollm2-135m-instruct
              requeueAfterSeconds: 60
          - clusters:
              # The cluster's Argo CD Secret, for its labels: a hub that is also a site syncs
              # through the in-cluster API, not the ACM cluster proxy.
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'acm-models-smollm2-135m-instruct-{{.name}}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: REQUIRED-libraryRepoURL
        targetRevision: REQUIRED-libraryRevision
        path: apps/acm-models/smollm2-135m-instruct
      destination:
        server: '{{ if eq (index .metadata.labels "local-cluster") "true" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: models-as-a-service
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
