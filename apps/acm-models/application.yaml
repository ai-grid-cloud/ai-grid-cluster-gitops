apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Dedicated GitOps app for the AI Grid model ApplicationSet. It is
  # discovered automatically by the bootstrap ApplicationSet.
  name: acm-models
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@libraryRepoURL@'
    targetRevision: '@libraryRevision@'
    path: apps/acm-models/hub
    # The library's own repository and revision for the ApplicationSets in
    # this directory (its inputs.yaml), from the root's values.
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: library-inputs
          patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: library-inputs
            data:
              libraryRepoURL: '@libraryRepoURL@'
              libraryRevision: '@libraryRevision@'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
