apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The provider console's catalog: its AppProjects and the ApplicationSets
  # that deliver the models and subscriptions the console commits (and a
  # GitOpsCluster a dedicated hub leaves out). The library's sample models are
  # apps/acm-models-samples.
  name: acm-models
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@libraryRepoURL@'
    targetRevision: '@libraryRevision@'
    path: apps/acm-models/hub
    # The catalog repository and branch for the ApplicationSets in this
    # directory (its inputs.yaml), from the root's values.
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: library-inputs
          patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: library-inputs
            data:
              catalogRepoURL: '@catalogRepoURL@'
              catalogRevision: '@catalogRevision@'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
