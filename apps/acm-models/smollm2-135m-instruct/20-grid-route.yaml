# The sample model's route on the models Gateway (apps/rhoai/grid-models),
# which the grid provider gateway forwards to: a peer's call for
# smollm2-135m-instruct reaches this model's InferencePool. The header is the model
# name the ingress consumer promotes from the request body, the
# LLMInferenceService's spec.model.name and the ExternalModel's targetModel.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smollm2-135m-instruct-grid
  namespace: ai-grid-internal-models
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-grid-models
      namespace: openshift-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
          headers:
            - name: X-Gateway-Model-Name
              type: Exact
              value: smollm2-135m-instruct
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: smollm2-135m-instruct-inference-pool
          port: 8000
      timeouts:
        request: 0s
        backendRequest: 0s
